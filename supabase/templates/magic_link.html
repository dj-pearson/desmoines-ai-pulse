<!DOCTYPE html>
<html>
<body style="margin:0;padding:0;background:#f5f5f5;">
  <div style="max-width:560px;margin:0 auto;padding:24px;background:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#222;line-height:1.5;">
    <h2 style="margin:0 0 12px;font-size:20px;">Your sign-in link</h2>
    <p style="margin:0 0 16px;">Use this link to sign in to Des Moines Insider. It works once and expires within the hour.</p>
    <p style="margin:0 0 24px;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1a1a2e;color:#ffffff;text-decoration:none;padding:10px 20px;border-radius:6px;font-weight:500;">Sign in</a></p>
    <p style="margin:0 0 8px;font-size:13px;color:#555;">Or enter this code: <strong>{{ .Token }}</strong></p>
    <p style="margin:0;font-size:13px;color:#555;">If you didn't ask to sign in, ignore this email.</p>
    <p style="margin:24px 0 0;font-size:12px;color:#666;">Des Moines Insider, Des Moines, Iowa, USA</p>
  </div>
</body>
</html>
