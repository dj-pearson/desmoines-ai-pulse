[functions.agent-approvals]
verify_jwt = false

# Agent control plane (AOS-CORE-008). Admin toggle-enabled + run-now for agents.
# Does its own auth via requireAdminOrApiKey (admin JWT).
[functions.agent-control]
verify_jwt = false

# Daily ops digest (AOS-CORE-010). Cron: batched summary of escalations,
