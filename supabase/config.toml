# Launch-time min-supported-version gate (IOS-AUDIT-REL-001). Called by the
# mobile apps BEFORE the user signs in, so JWT must be optional. Does no DB work
# and holds no secrets — only returns compile-time version constants.
[functions.version-check]
verify_jwt = false

