project_id = "wtkhfqpmcegzcbngroui"

# Launch-time min-supported-version gate (IOS-AUDIT-REL-001). Called by the
# mobile apps BEFORE the user signs in, so JWT must be optional. Does no DB work
# and holds no secrets — only returns compile-time version constants.
[functions.version-check]
verify_jwt = false

# Sponsored picks for AI discovery flows (IOS-ADS-015). Public sponsored content,
# so JWT is optional — tier is resolved opportunistically from the bearer token
# when present (premium users get no ads); anonymous/free callers are eligible.
[functions.get-sponsored-pick]
verify_jwt = false

[functions.analyze-competitor]
verify_jwt = false

[functions.bulk-enhance-events]
verify_jwt = false

[functions.publish-article-webhook]
verify_jwt = false

[functions.personalized-recommendations]
# Accesses user-specific data; user id is derived from the JWT, never the body.
verify_jwt = true

[functions.geocode-location]
verify_jwt = false

[functions.generate-seo-content]
verify_jwt = false

[functions.image-transform]
verify_jwt = false

# Dynamic OG-image cards for social shares (WEB-FEAT-008). Public: crawlers hit it
# with no auth, so verify_jwt=false (like image-transform). Rate-limited in-fn.
[functions.og-image]
verify_jwt = false

# Escalation router (AOS-CORE-005). Cron control-plane job: routes tier-2/3
# agent_tasks to the right human queue and coalesces duplicates. Does its own
# auth via requireAdminOrApiKey (cron service-role key or admin JWT).
[functions.agent-escalation-router]
verify_jwt = false

# Consolidated AOS agent dispatcher — hosts the 34 former agent-<name> cron
# functions, routed by agent_key at /functions/v1/agent-runner/<agent_key>.
# Cron control-plane job; auth via requireAdminOrApiKey (same gate the individual
# agents used). See supabase/functions/_shared/agents/.
[functions.agent-runner]
verify_jwt = false

# Agent action approvals (AOS-CORE-007). Admin approve/reject + cron sweep of
