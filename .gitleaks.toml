# gitleaks configuration (WEB-SEC-008).
# Uses the full default ruleset and FAILS CI on any newly-introduced secret.
#
# The allowlist below covers ONLY pre-existing, already-public exposures so that
# CI gates *new* leaks rather than blocking every PR on history we can't unship.
# Each allowlisted item is tracked for rotation in docs/SECRETS_ROTATION.md.

title = "Des Moines AI Pulse secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Known historical exposures — see docs/SECRETS_ROTATION.md (rotate, do not add new)."
regexTarget = "match"
paths = [
  # .env.example contains only placeholder values.
  '''\.env\.example''',
  # Docs reference key *prefixes* / placeholders, not live secrets.
  #
  # WEB-SEC-032: this blanket entry was doing more work than its comment claimed.
  # Two markdown files carried a live key under it -- docs/restaurant-scraper-make-
  # integration.md in three places and android/ANDROID_SETUP_GUIDE.md in one --
  # so "not live secrets" was an assumption, not a fact. Both are redacted now.
  # The entry stays because docs legitimately quote key PREFIXES when explaining
  # a format, but it is the widest rule here and worth narrowing if a scan is
  # ever clean without it.
  '''.*\.md''',
  '''\.gitleaks\.toml''',

  # WEB-SEC-032: FIFTEEN ENTRIES REMOVED FROM HERE, and the removal is the point.
  #
  # Eleven migrations carried a service_role JWT and four scripts carried an anon
  # key. All fifteen were allowlisted, so the scanner was configured not to look
  # at exactly the files that had the problem -- and an allowlist that grows is a
  # scanner that reports less every quarter.
  #
  # The literals are gone from the working tree: the migrations read
  # public.app_secret('service_role_key'), and the scripts read
  # VITE_SUPABASE_ANON_KEY and refuse to run without it. The key is removed from
  # the DATABASE by supabase/migrations/20260902000015_purge_embedded_service_key.sql,
  # which had been embedded in five live function bodies.
  #
  # THE VALUE IS STILL IN GIT HISTORY AND ALWAYS WILL BE. Rotation is the only
  # fix for that, and it is the owner's, tracked in docs/SECRETS_ROTATION.md.
]

# False positives from the default `generic-api-key` rule. These are not
# credentials and must not be moved into a secret store — see the reasoning at
# each site. Listed as value regexes rather than file paths so the rest of each
# file stays scanned.
regexes = [
  # localStorage key names (src/hooks/useGuestFavorites.ts, src/lib/guestFavorites.ts).
  # High entropy only because they carry a "_v1" schema suffix; they name a
  # browser storage slot and are visible in devtools to anyone on the page.
  '''guest_favorites_v1''',
  '''dmi-guest-favorites-v1''',

  # IndexNow key (supabase/functions/_shared/indexNow.ts). Public by protocol
  # design: it is already served at public/c2d7b3a0ed753ae68b306e25422227ff.txt
  # so search engines can verify host ownership, and it grants exactly one
  # capability — asking Bing to recrawl a URL on our own host, which anyone who
  # fetches that file can already do. The edge function and the static file must
  # agree on the value, so it cannot live in a secret store.
  '''c2d7b3a0ed753ae68b306e25422227ff''',
]
