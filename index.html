<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="cache-version" content="4.0.0" />
    <meta name="build-timestamp" content="__BUILD_TIMESTAMP__" />
    <meta name="impact-site-verification" value="e1bd2196-112a-4a58-8dd8-bdd7f1084090" />
    
    <!-- CRITICAL: Prevent any HTML caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Note: CSP frame-ancestors directive should be in HTTP headers, not meta tag -->
    <!-- The warning about frame-ancestors being ignored in meta tags is expected -->

    <!-- Open Graph -->
    <!-- Fallback og tags for routes served the raw shell. data-rh hands them to
         Helmet so per-page values replace rather than duplicate (WEB-SEO-002).
         Kept query-led rather than product-led, same as the description. -->
    <meta data-rh="true" property="og:title"
      content="Things to Do in Des Moines | Events, Restaurants & Attractions"
    />
    <meta data-rh="true" property="og:description"
      content="Find what's happening in Des Moines, Iowa today and this weekend — events, concerts, festivals, family activities, and restaurants open right now across the metro."
    />
    <meta property="og:type" content="website" />
    <!-- No static og:url on purpose (WEB-SEO-002): this shell serves every route,
         so a hardcoded one claimed the homepage as every page's share URL, and
         Helmet appends rather than replaces. Helmet supplies the real one. -->

    <!-- WEB-SEO-044. This is the card social crawlers actually get: most do not
         run JS, and the comment above records that Helmet APPENDS rather than
         replaces, so the shell's og:image is the one that wins. It pointed at
         DMI-Logo.png, an 800x800 SQUARE, under width/height that claim
         1200x630 - numbers Facebook and Twitter lay the card out from. A 1.91:1
         box reserved for a square image is worse than declaring nothing.
         og-default.png is a real 1200x630 card; see
         scripts/generate-og-default.mjs. -->
    <meta
      property="og:image"
      content="https://desmoinesinsider.com/og-default.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Des Moines Insider - events, restaurants and what to do in Des Moines" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Des Moines Insider" />
    <meta property="og:region" content="IA" />
    <meta property="og:country-name" content="USA" />

    <!-- Performance optimizations for mobile -->
    <!-- WEB-QUAL-007. theme-color paints the browser chrome above the page, so
         it should match what is actually at the top: the header is
         `bg-background`, which is #ffffff in light and #060a13 in dark
         (measured on a rendered build). It was a single fixed #2563eb - a
         Tailwind blue-600 that appears nowhere on this site - so a dark-mode
         visitor got a blue bar sitting above a near-black page. Two metas with
         a prefers-color-scheme media query is the modern form; browsers that
         ignore the media attribute fall back to the first. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#060a13" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Critical inline CSS for above-the-fold content -->
    <style>
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 214 100% 35%;
        --primary-foreground: 0 0% 100%;
        --border: 214.3 31.8% 91.4%;
        --radius: 0.75rem;
      }
      /* Dark tokens, same values as .dark in src/index.css, so a dark-mode
         visitor doesn't get a white frame before the app CSS arrives. The
         inline script below adds .light or .dark from the stored dmi-theme
         choice; :not(.light) keeps an explicit light choice light. */
      @media (prefers-color-scheme: dark) {
        :root:not(.light) {
          --background: 225 50% 5%;
          --foreground: 225 20% 98%;
          --primary: 225 87% 68%;
          --primary-foreground: 225 87% 10%;
          --border: 225 30% 15%;
        }
      }
      :root.dark {
        --background: 225 50% 5%;
        --foreground: 225 20% 98%;
        --primary: 225 87% 68%;
        --primary-foreground: 225 87% 10%;
        --border: 225 30% 15%;
      }
      * {
        border-color: hsl(var(--border));
      }
      body {
        background-color: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }
      .min-h-screen {
        min-height: 100vh;
      }
      .bg-background {
        background-color: hsl(var(--background));
      }
      .text-foreground {
        color: hsl(var(--foreground));
      }
      .flex {
        display: flex;
      }
      .items-center {
        align-items: center;
      }
      .justify-center {
        justify-content: center;
      }
      .justify-between {
        justify-content: space-between;
      }
      .container {
        width: 100%;
        margin-left: auto;
        margin-right: auto;
        padding-left: 1rem;
        padding-right: 1rem;
      }
      @media (min-width: 640px) {
        .container {
          max-width: 640px;
        }
      }
      @media (min-width: 768px) {
        .container {
          max-width: 768px;
        }
      }
      @media (min-width: 1024px) {

          max-width: 1024px;
        }
      }
      @media (min-width: 1280px) {

          max-width: 1280px;
        }
      }
      /* The site header only (it carries .sticky). A bare `header` selector
         also pinned in-page <header>s - the /outdoors intro and every pSEO

      header.sticky {
        position: sticky;
        top: 0;
        z-index: 50;
        border-bottom: 1px solid hsl(var(--border));
        background-color: hsl(var(--background));
      }
      h1 {
        font-size: 2.25rem;
        font-weight: 700;
        line-height: 1.2;
      }
      @media (min-width: 768px) {
        h1 {
          font-size: 3.75rem;
        }
      }
      .text-xl {
        font-size: 1.25rem;
        line-height: 1.75rem;
      }
      .text-3xl {
        font-size: 1.875rem;
        line-height: 2.25rem;
        font-weight: 700;
      }
      .relative {
        position: relative;
      }
      .absolute {
        position: absolute;
      }
      .inset-0 {
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
      }
      .z-10 {

      }
      .grid {

        margin-right: auto;
      }
      .max-w-7xl {

      }

        max-width: 48rem;
      }
      .text-center {
        text-align: center;
      }
      .text-white {
        color: #fff;
      }
      .overflow-hidden {
        overflow: hidden;
      }
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }
    </style>

    <!-- Applies the stored dmi-theme (ThemeProvider's key) before first paint.
         Pinned by SHA-256 in public/_headers script-src; regenerate the hash
         if you edit it (node scripts/check-csp-hashes.mjs). -->
    <script>
      (function () { try { var t = localStorage.getItem("dmi-theme"); var d = t === "dark" || ((!t || t === "system") && window.matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.classList.add(d ? "dark" : "light"); } catch (e) {} })();
    </script>

    <!-- Core Web Vitals optimization: DNS prefetch and preconnect for critical resources -->
    <!-- IMPORTANT: Use at most 4 preconnect hints (Lighthouse recommendation) -->
    <!-- No Google Fonts: nothing in the CSS names Inter, and the request sent
         every visitor's IP to Google before consent. The body font is the
         system stack above. -->

    <!-- Database: Critical for interactivity (crossorigin needed for fetch/XHR requests) -->
    <!-- Project URL is injected at build time from VITE_SUPABASE_URL (no hardcoded project ref) -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />

    <!-- Analytics: Non-critical, DNS prefetch only -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="dns-prefetch" href="https://www.google-analytics.com" />

    <!-- CDN: DNS prefetch only (not used on initial load) -->
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- External resources: DNS prefetch for better performance -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />

    <!-- Third-party APIs: DNS prefetch for Stripe and map tiles -->
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />

    <!-- No logo preload: the header doesn't render DMI-Logo-Header.webp, so
         the preload was a high-priority fetch nobody used. -->

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- CRITICAL: Early error handler for Capacitor/mobile and extension-induced failures.
         Module-level errors in ES modules are silent in WKWebView.
         Also catches "Unexpected token '<'" from Lockdown/SES extensions intercepting scripts.
         This handler runs BEFORE the app's module script loads. -->
    <script>
      (function() {
        var isCapacitor = typeof window.Capacitor !== 'undefined';
        window.__earlyErrors = [];
        function showOverlay(html) {
          var overlay = document.getElementById('__early_error__');
          if (!overlay) {
            overlay = document.createElement('div');
            overlay.id = '__early_error__';
            overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#111;color:#ff6b6b;font:13px/1.5 monospace;padding:24px 16px;overflow:auto;-webkit-overflow-scrolling:touch;';
            if (document.body) document.body.appendChild(overlay);
            else document.addEventListener('DOMContentLoaded', function() { document.body.appendChild(overlay); });
          }
          overlay.innerHTML = html;
        }
        function isExtensionError(msg, src) {
          var s = String(msg || '') + ' ' + String(src || '');
          return s.indexOf("Unexpected token '<'") !== -1 ||
                 s.indexOf('SyntaxError') !== -1 && s.indexOf('.js') !== -1 ||
                 s.indexOf('lockdown') !== -1 ||
                 s.indexOf('SES') !== -1;
        }
        window.onerror = function(msg, src, line, col, err) {
          window.__earlyErrors.push({ msg: msg, src: src, line: line, err: err });
          if (isCapacitor || location.protocol === 'file:') {
            showOverlay('<div style="margin-bottom:12px;border-bottom:1px solid #333;padding-bottom:8px"><strong style="color:#ff4444">Startup Error</strong><pre style="white-space:pre-wrap;word-break:break-word;margin:4px 0 0;color:#ffa0a0">' + String(err && err.stack || msg).replace(/</g, '&lt;') + '</pre></div>');
          } else if (isExtensionError(msg, src)) {
            showOverlay('<div style="max-width:480px;margin:40px auto;padding:24px;text-align:left"><strong style="color:#ff4444;font-size:16px">Having trouble loading?</strong><p style="margin:16px 0;color:#ccc;line-height:1.6">This often fixes itself with a hard refresh. Try:</p><ul style="margin:16px 0;padding-left:20px;color:#ccc;line-height:1.8"><li><strong>Hard refresh</strong>: Ctrl+Shift+R (Windows) or Cmd+Shift+R (Mac)</li><li>Open in an Incognito/Private window</li><li>Disable extensions and refresh</li></ul><p style="margin:20px 0"><button onclick="location.reload(true)" style="background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-size:14px">Retry (hard refresh)</button></p><p style="margin:16px 0;font-size:12px;color:#888">Technical: ' + String(msg).replace(/</g, '&lt;').substring(0, 120) + '</p></div>');
          }
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          window.__earlyErrors.push({ msg: reason && reason.message || String(reason), err: reason });
        });
      })();
    </script>

    <!-- CRITICAL: Force clear all service worker caches -->
    <script>
      // Unregister ALL service workers and clear ALL caches immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => reg.unregister());
        });
      }
      if ('caches' in window) {
        caches.keys().then(cacheNames => {
          cacheNames.forEach(cacheName => caches.delete(cacheName));
        });
      }
    </script>

    <!-- Google Analytics, consent-gated (WEB-LEGAL-001) and deferred to protect INP.
         This block sets Consent Mode v2 defaults to DENIED and does NOT load
         gtag.js. src/lib/analyticsConsent.ts is the only caller of
         __dmiLoadAnalytics(), and it calls it only once the visitor has granted
         the analytics category in the cookie banner. Denial is the default even
         if the app never boots, which is what PrivacyPolicy.tsx promises. -->
    <!-- NOTE: this inline script is pinned by a SHA-256 hash in public/_headers
         CSP script-src. Do NOT env-template it (a templated body changes the
         served bytes and breaks the hash); a GA4 measurement id is public, not
         a secret. If you edit this block, regenerate the hash per _headers. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // Consent Mode v2 defaults. Everything non-essential starts denied, so a
      // visitor who has not opted in gets no analytics or advertising storage
      // even in the window before the app hydrates.
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
        personalization_storage: "denied",
        functionality_storage: "granted",
        security_storage: "granted",
      });
      gtag("js", new Date());
      gtag("config", "G-XGQFFP9BHZ");

      // Fetching gtag.js is itself a disclosure to Google, so the tag is not
      // requested at all until consent is granted. Idempotent: repeated grants
      // (banner reopened, event refired) load the script exactly once.
      window.__dmiLoadAnalytics = function () {
        if (window.__dmiAnalyticsLoaded) return;
        window.__dmiAnalyticsLoaded = true;
        var load = function () {
          var script = document.createElement("script");
          script.async = true;
          script.src =
            "https://www.googletagmanager.com/gtag/js?id=G-XGQFFP9BHZ";
          document.head.appendChild(script);
        };
        // Preserve the original INP protection: load once the page is idle.
        if ("requestIdleCallback" in window) {
          requestIdleCallback(load);
        } else {
          setTimeout(load, 4000);
        }
      };
    </script>

    <title>Des Moines Insider: Events, Restaurants & Attractions</title>
    <!-- Site-wide fallback description (WEB-SEO-002/012). data-rh hands it to
         Helmet so per-page descriptions REPLACE it instead of duplicating.
         Do not add data-rh to viewport/theme-color/verification tags — Helmet
         deletes any data-rh tag it does not re-emit. -->
    <meta
      data-rh="true"
      name="description"
      content="Events, restaurants and things to do in Des Moines, Iowa. What's on today and this weekend across the metro, updated daily."
    />
    <meta name="author" content="Des Moines Insider" />
    <!--
      NO STATIC CANONICAL HERE ON PURPOSE.

      This file is the shell for every route, so a hardcoded canonical link
      pointing at the site root claimed the HOMEPAGE as the canonical URL of
      all 31 prerendered routes. Helmet adds the correct per-route canonical on
      top, so every prerendered page shipped TWO conflicting canonical tags,
      one of them pointing at "/". Google treats conflicting canonicals as
      untrustworthy and may ignore both, which is the opposite of what the
      prerender step (PROD-SEO-001) exists to achieve.

      SEOHead supplies the canonical per route, including the homepage.

      (Deliberately no example tag in this comment: the prerenderer serializes
      comments into every shipped route, so a literal link tag here shows up in
      text-based audits as a phantom second canonical.)
    -->

    <!-- WEB-SEO-026: this listed "SMS concierge Des Moines", "voice assistant
         Des Moines events" and "ChatGPT Des Moines plugin" among the terms the
         site wants to be found for. None of the three exists. Targeting a
         query the site cannot answer earns a bounce, not a ranking. -->
    <meta
      name="keywords"
      content="Des Moines events, Des Moines restaurants, things to do Des Moines, Des Moines attractions, Des Moines concerts, family activities Des Moines, Des Moines event calendar, restaurant openings Des Moines, Des Moines trip planner, Iowa events"
    />

    <!-- Enhanced meta tags for AI optimization -->
    <meta name="article:publisher" content="Des Moines Insider" />
    <meta name="article:author" content="Des Moines Insider Team" />
    <!-- No static article:published_time/modified_time (WEB-SEO-015): this shell
         serves every route, so they dated all content alike and shipped a stale
         freshness signal. Real articles get accurate values from SEOHead. -->
    <meta name="article:section" content="Local Guide" />
    <meta
      name="article:tag"
      content="Des Moines, Events, Restaurants, Attractions, Local Guide"
    />

    <!-- Geographic targeting -->
    <!-- geo.placename / geo.position / ICBM come from each page's Helmet tags
         (SEOHead's downtown default, an event's own venue on its detail page).
         A static copy here survived alongside them, so a Waukee event carried
         both its own position and downtown's (events-pass2 WP4 item 9). -->
    <meta name="geo.region" content="US-IA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@desmoinesinsider" />
    <meta name="twitter:creator" content="@desmoinesinsider" />
    <meta data-rh="true" name="twitter:title"
      content="Des Moines Insider: Events, Restaurants & Attractions"
    />
    <!-- WEB-SEO-026: promised recommendations "via web, SMS, voice, or
         ChatGPT". Only the web one exists. -->
    <meta data-rh="true" name="twitter:description"
      content="Events, restaurants and attractions in Des Moines, Iowa - what's on this week, where to eat, and what to do."
    />
    <meta
      name="twitter:image"
      content="https://desmoinesinsider.com/og-default.png"
    />

    <!-- WEB-SEO-026: A SoftwareApplication BLOCK USED TO SHIP FROM HERE, ON
         EVERY ROUTE, and it was a list of channels that do not exist. It
         declared operatingSystem "Web, iOS, Android, Alexa, Google Assistant"
         and a featureList including "Multi-channel access (Web, SMS, Voice,
         ChatGPT)". There is no Alexa skill, no Google Assistant action, no SMS
         number and no ChatGPT plugin; XPLAT-009 records that the assistant is
         missing from the web app entirely.
         It also had no data-rh attribute, so the prerenderer's dedupeJsonLd -
         which only touches Helmet-managed blocks - could never replace or
         remove it. Every page carried it verbatim.
         The site's identity now comes from ONE Organization node emitted by
         SEOHead, with a stable @id, and the WebSite node lives on / only. -->

  </head>

  <body>
    <div id="root">
      <!-- Fallback content - replaced by React when app mounts successfully -->

      <div style="min-height:100vh;background:hsl(var(--background));color:hsl(var(--foreground));font-family:system-ui,sans-serif">

        <div class="js-loading" style="display:flex;align-items:center;justify-content:center;min-height:100vh">
          <div style="text-align:center;color:#666">
            <div style="width:40px;height:40px;border:3px solid #ddd;border-top-color:#2563eb;border-radius:50%;margin:0 auto 16px;animation:spin 1s linear infinite"></div>
            <p style="margin:0;font-size:14px">Loading...</p>
            <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
