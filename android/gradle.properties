org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=2
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Enable R8 full mode for maximum optimization
android.enableR8.fullMode=true
android.dependency.useConstraints=true
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
# KSP uses kotlin.sourceSets to register generated code; suppress until KSP supports android.sourceSets
android.disallowKotlinSourceSets=false
