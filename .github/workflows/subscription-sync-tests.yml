name: Edge Function & Cross-Platform Contract Tests

# Trigger scope was previously four billing functions plus _tests/, which left
# ~69 of the 73 edge functions with no CI execution on change. Edge functions
# are versioned API surfaces that shipped iOS/Android binaries call by name
# (CLAUDE.md, "Supabase Edge Functions"), so a contract drift there breaks
# clients that cannot be redeployed.
#
# That gap is not theoretical: delete-user-account's documented "legacy POST
# without action field" branch was retired from the implementation while both
# mobile clients still invoke it with no body, so account deletion 400s on
# every mobile attempt — an App Store 5.1.1(v) blocker that no CI lane saw.
#
# Any change under supabase/functions/ now runs the invariant suite.
on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      # The contract has two ends. Watching only the server half is how
      # delete-user-account drifted: the edge function was changed and the
      # clients were not, and nothing here ran when a client changed either.
      - 'ios/DesMoinesInsider/**'
      - 'android/app/src/main/java/**'
      - 'src/hooks/useSubscription.ts'
      - 'src/hooks/__tests__/useSubscription.test.ts'
      # WEB-FEAT-019: the double opt-in test reads the newsletter hook and the
      # config.toml entry that makes the signup endpoint public, so a change to
      # either has to run this suite.
      - 'src/hooks/useNewsletterSubscription.ts'
      - 'src/hooks/__tests__/useNewsletterSubscription.test.ts'
      - 'supabase/config.toml'
      - 'src/components/SubscriptionPlatformBreakdown.tsx'
      # The IndexNow key file. Its contents have to match INDEXNOW_KEY exactly
      # or every submission 403s, and the file lives nowhere near the function
      # that depends on it — so a PR touching only public/ must run this suite.
      - 'public/*.txt'
      # The GitHub Actions crawler posts its own heartbeat row into
      # automation_job_runs (WEB-BE-043) - nothing inside Supabase can observe
      # an external process - so a change to it has to run the health suite.
      - 'crawlers/catchdesmoines_crawler.py'
      # CLAUDE.md is asserted by ingest-coordinates.test.ts (WEB-BE-050).
      - 'CLAUDE.md'
      # The canonical category vocabulary and its browser mirror (WEB-BE-049).
      - 'src/lib/eventCategories.*'
      - 'src/components/EventSubmissionForm.tsx'
      - '.github/workflows/subscription-sync-tests.yml'

concurrency:
  group: subscription-sync-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: useSubscription read-side tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run src/hooks/__tests__/useSubscription.test.ts

  deno:
    name: Edge function & migration invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deno.lock is lockfile v5, which Deno 1.x refuses to read ("Unsupported
      # lockfile version '5'"), so this job died on its first step. Deno 2 also
      # dropped the `--allow-none` flag — the steps below rely on the default,
      # which is already "no permissions".
      - uses: denoland/setup-deno@v1
        with:
          deno-version: v2.x
      - run: deno test --allow-read supabase/functions/_tests/cross-platform-sync.test.ts
      - run: deno test supabase/functions/_tests/version-check.test.ts
      # Reads the iOS/Android sources as well as the edge function, so the
      # client/server deletion contract can't drift again (XPLAT-001).
      # XPLAT-011. Asserts docstring, implementation and all three clients agree
      # on the request contract -- the comparison nobody was making when
      # XPLAT-001 shipped a two-step docstring against three bodyless clients.
      - run: deno test --allow-read supabase/functions/_tests/client-contract.test.ts
      - run: deno test --allow-read supabase/functions/_tests/account-deletion-contract.test.ts
      # Erasure has to reach uploaded files, not just table rows. Every upload
      # bucket is public, so anything the purge misses stays fetchable by URL
      # (WEB-LEGAL-003).
      - run: deno test --allow-read supabase/functions/_tests/purge-user-storage.test.ts
      # Fails when a table with a user_id column is neither purged nor
      # deliberately retained, so erasure coverage cannot drift silently
      # the next time a feature adds a table (WEB-LEGAL-004).
      - run: deno test --allow-read supabase/functions/_tests/user-data-tables.test.ts
      # The marketing opt-out has to be read from the key the clients write.
      # The classifier read communication_preferences.marketing/.email; the clients
      # write email_notifications, so a stored opt-out was invisible to every sender
      # and nothing typed, compiled or tested said so (WEB-LEGAL-012).
      - run: deno test --allow-read supabase/functions/_tests/marketing-consent-contract.test.ts
      # WEB-LEGAL-012 AC6, the other half of the same defect. The contract test
      # above compares the key the clients write against the key the classifier
      # reads, which catches a rename and cannot catch a sender that reads the
      # right key and mails anyway. These RUN one agent from each family -
      # nurture, re-engagement, churn, milestone, outreach - against an opted-out
      # profile and assert no send is attempted, each paired with an opted-in run
      # that proves the fixture drives the agent that far.
      # --allow-env because the suite DELETES RESEND_API_KEY and the Anthropic
      # keys before importing anything: without that, a runner holding them would
      # turn this into real outbound mail.
      # --no-check=remote, and this step is why the whole job has been red.
      # Alone among these suites it imports an agent that imports supabase-js,
      # and Deno type-checks the downloaded index.d.mts, which carries a
      # reference to @types/node. There is no node_modules for Deno to resolve
      # that from on the runner, so the run dies before any test executes:
      #   error: Could not find "@types/node" in a node_modules folder.
      # WEB-LEGAL-012's notes predicted the opposite - "CI has the network and
      # needs neither the map nor --no-check" - which was true of the import MAP
      # and wrong about the type check.
      # =remote was the first attempt at that, on the reasoning that it would
      # keep type-checking the test's own source while skipping the downloaded
      # .d.ts files. It does not work: --no-check=remote skips the BODIES of
      # remote declaration files but still resolves their type-reference
      # directives, and the reference to @types/node is exactly such a
      # directive. So the step kept dying at the same line and these four tests
      # have never once executed.
      # Bare --no-check gives up type-checking the test source too. That is a
      # real loss, and still the better trade: four tests that run beat four
      # tests that are type-checked and skipped. The alternative that keeps both
      # is a root deno.json with nodeModulesDir + an @types/node import and a
      # deno install step, which is a lot of machinery for one suite.
      - run: deno test --allow-read --allow-env --no-check supabase/functions/_tests/marketing-optout-agents.test.ts
      # XPLAT-007. The right of ACCESS must stay sourced from the same list as
      # the right of erasure - they had drifted by 57 tables, and the export
      # named three that do not exist.
      - run: deno test --allow-read supabase/functions/_tests/export-user-data.test.ts
      # XPLAT-008. Two admin diagnostics that returned 404 on every press.
      # test-article-webhook POSTs to a caller-supplied URL, so the SSRF guard
      # running BEFORE the request is the assertion that matters.
      - run: deno test --allow-read supabase/functions/_tests/admin-diagnostics.test.ts
      # WEB-SEC-024. scrapeUrl is the single entry point for every ingestion path
      # and checked nothing, so a site that had asked not to be crawled was
      # crawled anyway. Found while drafting the Privacy Policy's sources section:
      # the ordinary reassurance would have been a false statement in it.
      - run: deno test --allow-read supabase/functions/_tests/robots.test.ts
      # WEB-SEC-024 AC6. scrapeUrl checks robots.txt above the backend fallback
      # chain so nothing can route around it - and six domain adapters routed
      # around it anyway by not calling scrapeUrl, each with its own pasted
      # Chrome UA. Pins that they fetch through the robots-checked helper and
      # declare no User-Agent of their own.
      - run: deno test --allow-read supabase/functions/_tests/adapter-robots.test.ts
      # WEB-BE-041. restaurant-opening-scraper hardcoded the retired model
      # claude-3-5-sonnet-20241022, so the API answered not_found for every
      # source on every run - and the handler returned success: true with HTTP
      # 200 regardless, which pg_cron then recorded as a successful POST. Pins
      # that all-sources-failed is a non-2xx, that a quiet day and a partial
      # failure are not, and that no model id is pasted back into index.ts.
      - run: deno test --allow-read supabase/functions/_tests/restaurant-opening-run-summary.test.ts
      # WEB-BE-042 AC3/AC5. The Catch Des Moines adapter parsed the site's own
      # ld+json @type and then discarded it, stamping category: "Community" on
      # every event - concerts, hockey games and theatre runs alike - while the
      # other live writer for the same source (the daily Python crawler) asks a
      # model for a real category. Pins the @type mapping, that the adapter
      # still derives rather than stamps, and that both writers use one
      # vocabulary, read from the Python crawler's own prompt.
      - run: deno test --allow-read supabase/functions/_tests/catchdesmoines-category.test.ts
      # WEB-BE-037. Four ingestion paths had four answers for "the source
      # published a day but no time" (19:31:58, 19:30, 19:00, 19:00), plus two
      # prompt instructions telling the model to invent 7 PM - so the same event
      # through two producers got two instants and same-date dedup could not
      # match them. ai-crawler's private parser also read `getHours() || 19` and
      # `getMinutes() || 30`, turning every on-the-hour time into :30 and
      # midnight into 7 PM. Pins all of it.
      - run: deno test --allow-read supabase/functions/_tests/no-time-marker.test.ts
      # WEB-BE-045. Nothing ever marked a restaurant closed: the Places field
      # mask asked for businessStatus and the answer was thrown away, and there
      # was no hours column at all. The normalizer decides two things a query
      # then depends on - an unrecognised status is dropped rather than stored,
      # so it cannot be read as a closure or as an operating venue; and hours
      # are null rather than an empty periods array, because `{periods: []}`
      # reads as "closed all week" and means "Google did not answer".
      - run: deno test --allow-read supabase/functions/_tests/place-hours.test.ts
      # WEB-CI-029 AC3. create-subscription-checkout decides whether a signed-in
      # user is sold a second subscription, and the decision was reachable only
      # through a live Stripe key. The ORDER of its checks is the behaviour: the
      # store check has to run before the upgrade path, or a user paying Apple
      # gets their Stripe subscription re-priced underneath them; and
      # cancel-at-period-end has to run before same-plan, since both are true of
      # that row and only one is actionable. Four negative controls prove each
      # ordering and the `>=` on store rank.
      - run: deno test --allow-read supabase/functions/_tests/checkout-decision.test.ts
      # WEB-BE-039. firecrawl-scraper matched a scraped venue with `includes`
      # either way, guarded by `searchText.length >= 5 || venueLower.length >= 5`
      # - an OR whose right-hand side is about the KNOWN venue, so it always
      # passed and a 4-character extraction like "Park" matched the first venue
      # containing it. The caller then overwrote the event's venue name, street
      # address and coordinates, so the event moved. Pins the length, word-
      # boundary and coverage rules, and that the scraper uses the shared matcher.
      - run: deno test --allow-read supabase/functions/_tests/venue-match.test.ts
      # WEB-CI-029 AC2. The money path had no test that crossed its own seam:
      # stripe-webhook decides what a Stripe status becomes in
      # user_subscriptions, _shared/entitlements.ts reads that column back and
      # decides entitlement, and nothing checked them together - so a status the
      # webhook writes but isSubscriptionRowEntitled does not recognise would
      # lock out a paying customer with no failure anywhere. Pins the status
      # map, the past_due grace window, platform='web' on the checkout row, and
      # that the update patch carries no identity columns.
      - run: deno test --allow-read supabase/functions/_tests/subscription-status-entitlement.test.ts
      # WEB-BE-043 AC6. The ingestion functions were the one class of automation
      # with no job ledger, so a source going dark was invisible: SeatGeek - 375
      # events, the largest single source - stopped ingesting on 2026-08-21 and
      # every run still returned 200 with 0 inserted, which is also what a quiet
      # week looks like. Pins the zero-result rule in both directions: it fires
      # after a non-zero baseline, and it stays quiet for a source that never
      # produced, a paused run and an empty calendar.
      - run: deno test --allow-read supabase/functions/_tests/ingestion-health.test.ts
      # WEB-BE-049. There was no canonical category list: SeatGeek wrote
      # "Comedy" and "Family" no other path produced, three row builders
      # defaulted to "General", and the shared extraction prompt asked for six
      # categories then showed the model an example using a seventh. The
      # /events filter chips are a SELECT DISTINCT, so every one of those words
      # became a chip. Pins the vocabulary, the word-prefix matching rule (a
      # plain includes() filed "Block Party" under Arts), and that every row
      # builder, the crawler, the prompt and the submission form use it.
      - run: deno test --allow-read supabase/functions/_tests/event-categories.test.ts
      # WEB-BE-044. bulk-update-restaurants wrote a key-less Places media URL
      # into restaurants.image_url under a comment claiming it stored the photo
      # reference name - so those rows render a 403 - and backfill-images copies
      # Place photo bytes into Storage permanently, while the Maps Platform
      # terms allow caching Place content for 30 days. Pins the detector, the
      # 30-day rule (an undated copy reads as EXPIRED), and that the guard in
      # fetchAndStoreImage is wired and nothing opts out of it.
      - run: deno test --allow-read supabase/functions/_tests/places-photo-terms.test.ts
      # WEB-BE-050. Only firecrawl-scraper set coordinates on an event, from a
      # known-venue match it held privately; ai-crawler set none at all, so
      # whether an event reached the map depended on which scraper found it -
      # and four nightly jobs existed to paper over the difference. CLAUDE.md
      # said "geocoding triggers maintain lat/lng" while the trigger only
      # RAISE NOTICEd. Pins both-or-neither coordinates, the (0,0) refusal, and
      # that both scrapers go through _shared/knownVenues.ts.
      - run: deno test --allow-read supabase/functions/_tests/ingest-coordinates.test.ts
      # WEB-BE-047. firecrawl-scraper allows 10 requests per 15 minutes keyed by
      # client IP; scrape-events invokes it once per scraping job from ONE
      # egress address, and 15 jobs are seeded - so the scraper throttled its
      # own orchestrator. And .limit(10) had no ORDER BY, so the same ten rows
      # came back every run and five jobs had never been scraped at all. Pins
      # the caller classification (an unset secret must not match an empty
      # header), that the exemption is opt-in, and that the ORDER BY precedes
      # the limit.
      - run: deno test --allow-read supabase/functions/_tests/scraper-rate-limit.test.ts
      # WEB-BE-046. scrape-events was 2,234 lines of which 1,180 were
      # unreachable, and its handler read 60 days of events plus every future
      # one to print a log line. firecrawl-scraper called generateEventSEO
      # without await, so the Edge Runtime killed every one of those Haiku
      # requests when the response was returned - and the .catch() made it look
      # handled. Its batch block reported 0/0/0/null on a run that had just
      # inserted forty events. Pins reachability, the removed read, that no
      # scraper fires a promise it will not await, and the batch arithmetic.
      - run: deno test --allow-read supabase/functions/_tests/scraper-dead-code.test.ts
      # WEB-BE-048. ai-crawler's policy on a failed duplicate check was "On
      # error, still add the item", so one PostgREST hiccup re-inserted the
      # whole batch - that check is the only thing between a re-crawl and a
      # duplicate row. Its events branch escaped its ilike pattern and its
      # restaurant/playground/attraction branch did not, so a name carrying a
      # percent became a wildcard and silently dropped a real record. Pins both
      # rules across the TypeScript and Python paths.
      - run: deno test --allow-read supabase/functions/_tests/duplicate-check-policy.test.ts
      # WEB-BE-053. bulk-enhance-events told the model, in capitals, to ADD
      # STATISTICS (attendance, years running, venue capacity) and INCLUDE
      # QUOTES/CITATIONS ("According to Des Moines Register...") while giving it
      # five fields containing no number, no year and no quote - so every one it
      # produced was invented, and attributed, and published. Its worked example
      # demonstrated five fabrications in six sentences. Pins that the prompt no
      # longer asks for any of it and that the example models omission.
      - run: deno test --allow-read supabase/functions/_tests/writeup-grounding.test.ts
      # WEB-BE-032. The ops digest counted with `count ?? 0` and discarded the
      # error, so a digest that could read nothing printed the same eleven
      # zeros as a system with nothing wrong. Pins that an unreadable section
      # never renders as a healthy one.
      - run: deno test supabase/functions/_tests/digest-format.test.ts
      # Crisis floor on the public AI surfaces: pins the matcher in both
      # directions and asserts every surface short-circuits before the model
      # call, which is the whole design (WEB-LEGAL-005).
      - run: deno test --allow-read supabase/functions/_tests/crisis-support.test.ts
      # WEB-ADS-001. A sponsored listing is delivered by a flag nothing set for six
      # months. Pins activate_campaign + the campaigns status trigger as the only
      # writer, and fails if the lifecycle job or any client starts flagging
      # listings on its own.
      - run: deno test --allow-read supabase/functions/_tests/sponsored-listing-activation.test.ts
      # WEB-ADS-004. pending_review was written by the client and absent from the
      # enum; the lifecycle job was on no schedule; approval was three writes with
      # no transaction. Pins the enum labels, the pure-SQL cron job and the
      # admin-only approval RPC.
      - run: deno test --allow-read supabase/functions/_tests/campaign-lifecycle-contract.test.ts
      # WEB-BE-040. Seven ingest sites set is_featured with Math.random() for a
      # year. Fails on any edge function that decides the flag by chance, and
      # pins the cleanup migration plus the homepage rail fallback.
      - run: deno test --allow-read supabase/functions/_tests/featured-flag-invariant.test.ts
      # WEB-BE-035. The dispatcher parked jobs at 'running' and scrape-events
      # only accepted 'idle'. Holds the migration and the edge function to one
      # status contract.
      - run: deno test --allow-read supabase/functions/_tests/scraping-dispatch-status.test.ts
      # WEB-BE-036. The events table permitted one row per title per venue
      # FOREVER, so a weekly residency or a Sat/Sun performance pair could not be
      # stored. Holds the migration, the shared dedup and the Python crawler to
      # one title + Central calendar date + venue key.
      - run: deno test --allow-read supabase/functions/_tests/event-unique-key.test.ts
      # eventDedup has had its own suite since DMI-010 and no lane ever ran it.
      - run: deno test supabase/functions/_shared/eventDedup.test.ts
      # WEB-SEC-026. An aal1 token is a valid GoTrue credential, so the browser
      # refusing to render a dashboard stops nobody. This pins the server-side
      # refusal: an admin endpoint must reject a caller who has a verified
      # factor and did not complete it.
      - run: deno test --allow-read supabase/functions/_tests/mfa-assurance.test.ts
      # WEB-SEC-027 / WEB-SEC-028. Two of the three sign-in throttles took their
      # input from the caller: ten anonymous POSTs locked any address out, and
      # one more cleared the attacker's own counter. Pins both closed.
      - run: deno test --allow-read supabase/functions/_tests/login-throttle-contract.test.ts
      # WEB-ADS-003. The browser wrote total_cost into a table with no RLS policy
      # and Stripe was asked for that number, so a campaign could be bought for a
      # cent. Pins the trigger, the server-side recompute and the displayed total
      # to one rate card.
      - run: deno test --allow-read supabase/functions/_tests/campaign-pricing-authority.test.ts
      # WEB-ADS-002. Impressions and clicks were inserted from the browser into
      # tables with no INSERT policy, so RLS refused every write and every
      # advertiser dashboard read zero. Pins the server-side write path, the bot
      # filter, idempotency, and the frequency cap being switched on.
      - run: deno test --allow-read supabase/functions/_tests/ad-event-tracking.test.ts
      # WEB-FEAT-013. The double-charge guards used .single() on a query that
      # matches one row PER PLATFORM, so they nulled out for exactly the users
      # already paying twice, and a cross-tier upgrade opened a SECOND Stripe
      # subscription. Pins the platform-scoped guard and the in-place upgrade.
      - run: deno test --allow-read supabase/functions/_tests/subscription-upgrade-contract.test.ts
      # WEB-FEAT-014. The trial was decided from the ACTIVE web row, so cancel,
      # lapse, resubscribe granted another 7 free days, once per cancellation.
      # Pins the first-purchase rule and the two unfiltered reads behind it.
      - run: deno test --allow-read supabase/functions/_tests/trial-eligibility.test.ts
      # WEB-FEAT-015. One .single() over every platform, so a dual-platform
      # subscriber matched two rows and read as "no subscription", and an
      # iOS-only row (no stripe_customer_id) got the same message. Pins the
      # per-platform reads, the store deep-link answer, and the one place the
      # site URL now comes from. --allow-env: getSiteUrl reads SITE_URL.
      - run: deno test --allow-read --allow-env supabase/functions/_tests/manage-subscription-platforms.test.ts
      # WEB-FEAT-017. Favorites/saved-search caps were browser-only and
      # saved-search-alerts mailed every row regardless of tier. Pins the
      # BEFORE INSERT triggers, the -1-is-unlimited rule, the shared 14-day
      # grace window, and the entitlement filter on the nightly job.
      - run: deno test --allow-read supabase/functions/_tests/plan-limit-enforcement.test.ts
      # WEB-FEAT-019. The signup promised a confirmation nothing sent, an
      # unsubscribed address could never come back, and the weekly digest read
      # this table only for a token while ignoring the status - so the
      # one-click opt-out stopped nothing. Pins the confirm flow, the upsert,
      # the single generic answer, and the digest's status check.
      - run: deno test --allow-read supabase/functions/_tests/newsletter-double-optin.test.ts
      # WEB-FEAT-016. VIP listed eight benefits at $12.99/month and delivered
      # none. Fails if the pricing page or the stored plan row promises a feature
      # no component gates on.
      - run: deno test --allow-read supabase/functions/_tests/plan-features-truthful.test.ts
      # WEB-AUTH-002. Signup collects phone, location, interests and marketing
      # preferences into raw_user_meta_data and nothing ever moved them, so those
      # profile columns were NULL for every account. Pins the trigger, its
      # never-block-signup guarantee, and the non-racing client fallback.
      - run: deno test --allow-read supabase/functions/_tests/new-user-profile-contract.test.ts
      # WEB-PERF-030. SocialEventCard fell back to a per-event hook that opened
      # three realtime channels and ran three queries PER CARD, on pages that
      # render up to 100. Pins the opt-in realtime default and the batch wiring
      # on every landing page.
      - run: deno test --allow-read supabase/functions/_tests/event-social-fanout.test.ts
      - run: deno test --allow-read supabase/functions/_tests/list-hooks-query-cache.test.ts
      - run: deno test --allow-read supabase/functions/_tests/oauth-role-sync-self-only.test.ts
      - run: deno test --allow-read supabase/functions/_tests/deal-redemption-ledger.test.ts
      - run: deno test --allow-read supabase/functions/_tests/event-visibility-both-switches.test.ts
      - run: deno test --allow-read supabase/functions/_tests/consent-record-user-binding.test.ts
      - run: deno test --allow-read supabase/functions/_tests/billing-teardown-before-erasure.test.ts
      - run: deno test --allow-read supabase/functions/_tests/session-timeout-policy.test.ts
      - run: deno test --allow-read supabase/functions/_tests/account-credentials-panel.test.ts
      - run: deno test --allow-read supabase/functions/_tests/no-embedded-credentials.test.ts
      - run: deno test --allow-read supabase/functions/_tests/brand-identity-consistency.test.ts
      - run: deno test --allow-read supabase/functions/_tests/event-links-and-hotel-seo.test.ts
      - run: deno test --allow-read supabase/functions/_tests/schema-states-only-columns.test.ts
      - run: deno test --allow-read supabase/functions/_tests/seatgeek-time-tbd.test.ts
      - run: deno test --allow-read supabase/functions/_tests/restaurants-hub-payload.test.ts
      # The trial-conversion notice must state amount, date and cancel path,
      # and must not be gated on marketing consent or an LLM score
      # (WEB-LEGAL-006).
      - run: deno test --allow-read supabase/functions/_tests/trial-notice.test.ts
      # A bucket created public must say why. Public means anonymous GET on a
      # guessable path with no expiry (WEB-LEGAL-007).
      # WEB-BE-030 AC4. Asserts the UNIQUE constraint that makes the guard real,
      # and that both webhooks read the lookup error instead of only its data.
      - run: deno test --allow-read supabase/functions/_tests/billing-webhook-idempotency.test.ts
      - run: deno test --allow-read supabase/functions/_tests/storage-bucket-posture.test.ts
      - run: deno test supabase/functions/_shared/jsonLdEvents.test.ts
      # IndexNow payload filtering plus the key-file/constant drift check
      # (WEB-SEO-011). Needs --allow-read for public/<key>.txt.
      - run: deno test --allow-read supabase/functions/_tests/indexnow.test.ts
      # Event-source parsing invariants — see docs/scraping/EVENT_SOURCE_PLAYBOOK.md.
      # All fixture-based; no network access needed.
      - run: deno test supabase/functions/_shared/centralTime.test.ts
      - run: deno test supabase/functions/_shared/eventSourceProfiles.test.ts
