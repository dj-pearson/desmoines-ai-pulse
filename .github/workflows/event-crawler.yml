# CatchDesMoines Event Crawler
# Runs daily at 6 AM Central Time to crawl new events

name: Daily Event Crawler

on:
  # Schedule: Run daily at 6 AM Central Time (11 AM UTC in winter, 12 PM UTC in summer)
  schedule:
    # 12:00 UTC = 6 AM CDT (summer) or 7 AM CST (winter)
    - cron: '0 12 * * *'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Maximum number of pages to crawl'
        required: false
        default: '5'
        type: string
      dry_run:
        description: 'Dry run (no database writes)'
        required: false
        default: false
        type: boolean

jobs:
  crawl-events:
    name: Crawl CatchDesMoines Events
    runs-on: ubuntu-latest
    # SUPABASE_SERVICE_ROLE_KEY and ANTHROPIC_API_KEY are scoped to the "Scrape"
    # environment, not to the repository. Without this line they resolve to the
    # empty string and catchdesmoines_crawler.py:90 raises "SUPABASE_URL and
    # SUPABASE_SERVICE_ROLE_KEY must be set" after ~1m45s of setup. That is the
    # failure that ran daily until 2026-02-12 and got this workflow switched off
    # (WEB-SEO-017). Scrape has no protection rules, so this adds no approval gate.
    environment: Scrape
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'crawlers/requirements.txt'

      # Before the ~5 minutes of crawl4ai and Playwright setup, because this
      # catches the failure mode that cost six months: the extraction window
      # landing on the navigation instead of the events, which produces a green
      # run with zero events and no error (WEB-SEO-017). Needs no dependencies.
      - name: Check the extraction window still lands on the events
        run: python crawlers/test_clean_html.py

      # Also before the dependency install, and for the same reason: the
      # 2026-08-23 run inserted one venue three times and reported
      # "Duplicates skipped: 0" (WEB-SEO-017). The dedupe decision is pure
      # logic over dicts, so it is checked here rather than by reading the
      # table afterwards.
      - name: Check the duplicate detection
        run: python crawlers/test_dedupe.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r crawlers/requirements.txt

      - name: Setup Crawl4AI
        run: |
          crawl4ai-setup
          crawl4ai-doctor || true

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run Event Crawler
        id: crawler
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_API: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd crawlers
          MAX_PAGES="${{ github.event.inputs.max_pages || '5' }}"
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python catchdesmoines_crawler.py --max-pages "$MAX_PAGES" $DRY_RUN_FLAG

      - name: Post Summary
        if: always()
        run: |
          echo "## Event Crawler Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Events Found**: ${{ steps.crawler.outputs.events_found || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Events Inserted**: ${{ steps.crawler.outputs.events_inserted || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duplicates Skipped**: ${{ steps.crawler.outputs.duplicates_skipped || 'N/A' }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Event crawler failed! Check the logs for details."

  # WEB-SEO-011: publish the freshness we just ingested.
  #
  # The crawler wrote new events to Postgres and then, until now, stopped. Every
  # crawler-visible surface stayed frozen at the last deploy:
  #   - public/sitemap-*.xml is generated by `npm run generate-sitemaps`, which
  #     only runs inside `npm run build`, which only runs on push to main.
  #   - The prerendered hub HTML has the same problem and it is worse:
  #     dist/events/today/index.html literally bakes in what "today" meant when
  #     we last shipped.
  # Freshness is the one structural advantage we have over a submission-based
  # DMO calendar, and we were generating it daily and then discarding it.
  #
  # Triggering a Cloudflare Pages rebuild fixes both at once, because the build
  # regenerates the sitemaps AND re-runs the prerenderer against current data.
  # That is why this is a deploy hook rather than a call to regenerate-sitemaps
  # alone — the edge function refreshes sitemap XML but cannot touch the
  # prerendered HTML.
  publish-freshness:
    name: Publish Freshness (sitemaps + prerender)
    runs-on: ubuntu-latest
    needs: crawl-events
    # Never publish off a dry run — there is nothing new to publish.
    if: success() && github.event.inputs.dry_run != 'true'

    steps:
      # Keeps the storage-bucket copies current for anything reading them
      # directly. Best-effort: the deploy below is what actually reaches
      # crawlers, so a failure here must not block it.
      - name: Regenerate sitemaps (edge function)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EDGE_FUNCTION_API_KEY: ${{ secrets.EDGE_FUNCTION_API_KEY }}
        run: |
          if [ -z "${EDGE_FUNCTION_API_KEY}" ] || [ -z "${SUPABASE_URL}" ]; then
            echo "::warning::SUPABASE_URL or EDGE_FUNCTION_API_KEY not set — skipping sitemap regeneration."
            exit 0
          fi
          code=$(curl -sS -o /tmp/regen.json -w '%{http_code}' -X POST \
            "${SUPABASE_URL}/functions/v1/regenerate-sitemaps" \
            -H "x-api-key: ${EDGE_FUNCTION_API_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 120 -d '{}') || true
          echo "regenerate-sitemaps HTTP ${code}"
          head -c 500 /tmp/regen.json 2>/dev/null || true
          [ "${code}" = "200" ] || echo "::warning::regenerate-sitemaps returned ${code}"

      # The step that actually makes new events visible to crawlers.
      - name: Trigger Cloudflare Pages rebuild
        id: deploy
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${DEPLOY_HOOK}" ]; then
            echo "::warning::CLOUDFLARE_DEPLOY_HOOK_URL is not set — sitemaps and prerendered HTML will stay stale until the next push to main. Create a deploy hook in the Cloudflare Pages project and add it as a repository secret (WEB-SEO-011)."
            echo "triggered=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' -X POST "${DEPLOY_HOOK}" --max-time 60) || true
          echo "deploy hook HTTP ${code}"
          if [ "${code}" != "200" ] && [ "${code}" != "201" ]; then
            echo "::error::Deploy hook returned ${code} — today's events will not reach crawlers."
            exit 1
          fi
          echo "triggered=true" >> "$GITHUB_OUTPUT"

      - name: Post Summary
        if: always()
        run: |
          echo "## Freshness Publish" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Rebuild triggered**: ${{ steps.deploy.outputs.triggered || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Why it matters**: the rebuild regenerates \`sitemap-*.xml\` and re-runs the prerenderer, so today's events become visible to crawlers that do not execute JavaScript." >> $GITHUB_STEP_SUMMARY

  # Optional: Update AI Configuration in Supabase
  update-ai-config:
    name: Update AI Configuration
    runs-on: ubuntu-latest
    # Same reason as crawl-events: SUPABASE_SERVICE_ROLE_KEY lives in Scrape.
    environment: Scrape
    needs: crawl-events
    if: success() && github.event_name == 'workflow_dispatch'

    steps:
      - name: Update AI Model Setting
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Update the default_model setting to Claude 4.5 Sonnet
          curl -X PATCH \
            "${SUPABASE_URL}/rest/v1/ai_configuration?setting_key=eq.default_model" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"setting_value": "claude-sonnet-4-5-20250929"}' \
            || echo "Note: AI config table may not exist yet"
