name: Secret Scan

# IOS-AUDIT-SEC-007: fail CI if a Secrets file or a key-shaped string is
# introduced. The diff scan targets newly added lines so the build stays green
# on pre-existing history while blocking any new leak.

on:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block tracked iOS Secrets files
        run: |
          if git ls-files | grep -E '(^|/)Secrets\.(xcconfig|generated\.swift)$'; then
            echo "::error::An iOS Secrets file is tracked in git. It bundles the Supabase anon key and must never be committed."
            exit 1
          fi
          echo "No iOS Secrets files tracked."

      - name: Scan PR diff for JWT/anon-key-shaped strings
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          added=$(git diff "$base" "$head" -- . | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          if printf '%s\n' "$added" | grep -E 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'; then
            echo "::error::A JWT/anon-key-shaped string was added in this PR. Supabase keys are injected at build time and must not be committed."
            exit 1
          fi
          echo "No newly added key-shaped strings."

      # AOS-SEC-003: broaden the diff scan to common provider key shapes and
      # high-entropy secret assignments. Placeholders (.env.example, docs, and
      # obvious example values / env-var references) are allowlisted to avoid
      # noise. On a hit the build fails without echoing the secret value.
      - name: Scan PR diff for provider secret patterns
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          added=$(git diff "$base" "$head" -- . ':(exclude).env.example' ':(exclude)**/*.md' \
            | grep -E '^\+' | grep -vE '^\+\+\+' || true)
          candidate=$(printf '%s\n' "$added" \
            | grep -viE 'your[_-]|example|changeme|placeholder|xxxx|<[a-z_]+>|process\.env|import\.meta\.env|Deno\.env|VITE_|dummy|sample' || true)
          patterns='(sk|rk)_live_[0-9a-zA-Z]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{35}|-----BEGIN[ A-Z]*PRIVATE KEY-----|(api[_-]?key|secret|token|password)["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"'][0-9a-zA-Z/+_-]{24,}["'"'"']'
          if printf '%s\n' "$candidate" | grep -Eiq "$patterns"; then
            echo "::error::A provider secret pattern (Stripe/AWS/Google/private-key/high-entropy assignment) was added in this PR. Secrets must be injected at runtime, never committed. (value withheld)"
            exit 1
          fi
          echo "No provider secret patterns in added lines."
