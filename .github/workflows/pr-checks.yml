name: PR Checks

on:
  pull_request:
    branches: [main, develop, "release/**"]

concurrency:
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan the whole diff range of the PR.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build when any secret is detected (default behavior).
          GITLEAKS_CONFIG: .gitleaks.toml

  validate:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      # Named-import integrity: a named import with no matching export is not a
      # type error, and esbuild strips types without checking, so it reaches
      # production as an undefined component (React #130). See WEB-QA-001.
      - name: Check import/export integrity
        run: npm run check-imports

      # Supabase schema-usage ratchet (WEB-QA-017). A query naming a table,
      # column, or RPC that does not exist is not a type error — it 400s at
      # runtime, the hook catches, and the UI renders an empty state, so the
      # feature silently does nothing. A single stale column took the homepage
      # events feed to zero rows in production. Known findings are frozen in
      # schema-baseline.json; this fails only on NEW ones. The baseline must
      # only ever shrink.
      - name: Check Supabase schema usage
        run: npm run check-schema

      # strictNullChecks migration ratchet (WEB-CI-007). The strict project
      # cannot pass yet (~88 real errors), so this does not gate on zero — it
      # fails only if a file gets WORSE or a new file starts erroring. Baseline
      # lives in strict-baseline.json; re-baseline with
      # `npm run type-check:strict:update` after improving.
      - name: strictNullChecks ratchet
        run: npm run type-check:strict:ratchet

      - name: Run unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Build production bundle
        run: npm run build

  # WEB-CI-023. `npm run type-check` above runs `tsc --noEmit` against the root
  # tsconfig, which is `"files": []` plus project references — so it compiles
  # ZERO files and has always exited 0. Two P1 crashes shipped straight through
  # it in one week: /stay called getCanonicalUrl with no import (TS2304), and
  # useSocialFeatures returned a bare `loading` after an unused-var autofix
  # renamed the binding (TS2552). Both are one-line errors that
  # `tsc -p tsconfig.app.json` reports.
  #
  # It cannot gate on zero: the app project has 400 pre-existing errors, mostly
  # PostgREST generic-instantiation noise. So it ratchets per-file, exactly like
  # the strict one — a file that gets worse, or a new file that starts erroring,
  # fails the build.
  #
  # Its own job rather than a step in `validate`: tsc over this project takes
  # several minutes (the generated Supabase types provoke a lot of TS2589), and
  # it must not sit in front of the build. Deliberately NOT in `npm run
  # validate` for the same reason — local validate has to stay usable.
  app-type-ratchet:
    name: App project type ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: tsconfig.app.json ratchet
        run: npm run type-check:app:ratchet
      # tsconfig.node.json is clean today, so this one is a real gate, not a
      # ratchet. Keep it that way.
      - name: tsconfig.node.json must stay clean
        run: npx tsc -p tsconfig.node.json --noEmit

  migration-safety:
    name: Migration Safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # WEB-DB-008: block destructive single-release migration changes. Attach the
      # `migration-override` label to the PR to bypass when the change is genuinely safe.
      - name: Check new migrations for destructive changes
        env:
          MIGRATION_SAFETY_OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'migration-override') }}
        run: node scripts/check-migration-safety.mjs
