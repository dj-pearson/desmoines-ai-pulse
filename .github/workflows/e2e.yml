name: E2E (critical suites)

# Two lanes, on purpose (WEB-CI-003):
#
#   1. `smoke`  — BLOCKING. A small critical-journey suite that must stay green.
#                 No continue-on-error. This is the lane to add to the branch
#                 ruleset's required status checks.
#   2. `e2e`    — NON-BLOCKING quarantine. The broad suites, which carry a known
#                 failure backlog (accessibility violations, PROD-A11Y-001).
#                 Keeps producing signal + an uploaded report without freezing
#                 merges while that backlog is worked down.
#
# Why a separate blocking lane instead of just un-quarantining the broad suites:
# ~28% of the full Playwright run was failing, so making it required would block
# every PR on pre-existing failures. A stable subset that gates real regressions
# today beats a comprehensive gate that has to be bypassed. Grow `smoke` as the
# quarantine lane's backlog shrinks; the end state is one required lane.
#
# The smoke suite runs against a PRODUCTION BUILD (playwright.smoke.config.ts),
# not the dev server, because the regressions it guards — undefined-component
# crashes from missing named exports — only reproduce once bundled.

on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (critical journeys, required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # The smoke suite asserts on real data paths (events queries, route mounts),
      # so it needs real credentials. Without them the build still succeeds but
      # the data assertions are meaningless.
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://desmoinesinsider.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      # Catches named imports with no matching export. These do not fail
      # type-check and esbuild strips types without checking them, so they reach
      # production as undefined components (React #130). Cheap, so run it first.
      - name: Check import/export integrity
        run: npm run check-imports

      # WEB-LEGAL-009 AC5. This also belongs in `npm run validate`, and it is
      # there - but PR Checks is switched off on GitHub (WEB-CI-025), so this
      # smoke job is the only required lane that runs at all today. Node-only,
      # no browser, under a second.
      - name: Check consent gate and CSP hashes
        run: npm run check-consent-csp

      - name: Run smoke suite against a production build
        run: npm run test:smoke

      # WEB-PERF-020 AC4. The smoke lane's webServer already ran `vite build`,
      # so dist/ is sitting there and this costs nothing. It cannot live in
      # `npm run validate`, which does not build.
      - name: Check critical-path bundle budget
        run: npm run check-bundle-budget

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # QUARANTINE LANE — non-blocking by design. Do not add to required checks
  # until its backlog is worked down; see docs/E2E_TRIAGE.md for the current
  # pass rate and what is quarantined.
  e2e:
    name: Playwright (broad suites, quarantined)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      # Use repo secrets when present; fall back to placeholders so the Vite dev
      # server boots even without backend creds (structural tests still run).
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL || 'https://desmoinesinsider.com' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium + system deps
        run: npx playwright install --with-deps chromium

      - name: Run critical E2E suites (Chromium only)
        continue-on-error: true
        run: >-
          npx playwright test
          tests/accessibility.spec.ts
          tests/links-and-buttons.spec.ts
          tests/forms.spec.ts
          tests/mobile-responsive.spec.ts
          --project=chromium-desktop
          --project=mobile-chrome

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
