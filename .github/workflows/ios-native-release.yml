# Des Moines Insider: archive, export and TestFlight upload.
#
# The build itself runs in the shared Pearson Media iOS release workflow
# (Pearson-Media/ios-release). This file says only what is particular to this
# app. Signing is automatic, so there are no provisioning profiles to keep
# current and no project patching; the IOS_DISTRIBUTION_CERT_* and
# IOS_PROVISIONING_PROFILE secrets are no longer read.
#
# Secrets used: the shared IOS_* signing set (copied in by ios-release's
# scripts/sync-signing-secrets.sh), SUPABASE_URL / SUPABASE_ANON_KEY (or the
# VITE_ names from the web build), and APPSTORE_* for the optional metadata
# upload.

name: iOS Native Release - TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g., 1.2.2). Empty keeps project.yml'
        required: false
        default: ''
      build_number:
        description: 'Build number (empty = run number + 100)'
        required: false
        default: ''
      upload:
        description: 'Upload to TestFlight (off = build and sign only)'
        type: boolean
        default: true
      upload_metadata:
        description: 'Upload App Store metadata + screenshots (overwrites the live listing)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    uses: Pearson-Media/ios-release/.github/workflows/ios-release.yml@main
    with:
      working-directory: ios
      project: DesMoinesInsider.xcodeproj
      scheme: DesMoinesInsider
      marketing-version: ${{ inputs.version }}
      build-number: ${{ inputs.build_number }}
      # project.yml is at build 66; run numbers here are still single digits.
      build-number-offset: 100
      require-tag-on-branch: ""
      upload: ${{ inputs.upload }}
      required-env: SUPABASE_URL SUPABASE_ANON_KEY
      # The App Clip has not shipped, so it is left out (set
      # IOS_INCLUDE_APP_CLIP=1 in BUILD_ENV to keep it). Then the Supabase
      # values go into the generated Swift files the app reads.
      prepare-command: |
        set -euo pipefail
        cd ios
        python3 scripts/strip-app-clip.py
        bash scripts/generate-secrets.sh
        if grep -q 'supabaseURL = ""' DesMoinesInsider/Configuration/Secrets.generated.swift; then
          echo "::error::SUPABASE_URL is empty in Secrets.generated.swift."
          exit 1
        fi
      expected-entitlements: |
        com.apple.developer.applesignin
        com.apple.developer.associated-domains
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.IOS_ASC_KEY_BASE64 }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_DEV_CERT_BASE64 }}
      P12_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      BUILD_ENV: |
        SUPABASE_URL=${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
        SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

  # Uploads ios/fastlane/metadata and screenshots with the existing
  # upload_metadata lane. Off by default because it overwrites the live App
  # Store listing (IOS-AUDIT-REL-004). Submitting for review stays a manual step
  # in App Store Connect.
  metadata:
    needs: release
    if: inputs.upload_metadata
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Upload App Store metadata & screenshots
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bundle exec fastlane upload_metadata 2>/dev/null \
            || fastlane upload_metadata
