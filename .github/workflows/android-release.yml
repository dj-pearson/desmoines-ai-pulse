# ================================================================
# Android Release: Build Signed AAB for Google Play
# ================================================================
#
# Builds a signed release Android App Bundle (.aab), or a signed APK
# with buildType=apk, and uploads it as a workflow artifact. Nothing
# here talks to Play: download the artifact from the workflow run and
# upload it in Play Console by hand. Every release so far has gone that
# way; there is no Play Publishing API step in this workflow.
#
# REQUIRED GITHUB SECRETS (signing):
#   1. ANDROID_KEYSTORE_BASE64        - Base64-encoded upload keystore (.jks)
#   2. ANDROID_KEYSTORE_PASSWORD      - Keystore password
#   3. ANDROID_KEY_ALIAS              - Key alias inside the keystore
#   4. ANDROID_KEY_PASSWORD           - Key password (often same as keystore password)
#
# REQUIRED GITHUB SECRETS (app config):
#   5. SUPABASE_URL (or VITE_SUPABASE_URL)            - Supabase project URL
#   6. SUPABASE_ANON_KEY (or VITE_SUPABASE_ANON_KEY)  - Supabase anon key
#   7. GOOGLE_SERVICES_JSON_BASE64    - Base64-encoded google-services.json
#                                       from Firebase console
#   8. GOOGLE_WEB_CLIENT_ID           - OAuth web client ID (Google Sign-In)
#   9. GOOGLE_MAPS_API_KEY            - Android-restricted Maps SDK key
#
# 8 and 9 used to be optional. A build without either installs and then
# has a feature that does nothing, which is the Broken Functionality
# rejection Play has already issued once, so both now fail the run.
#
# OPTIONAL GITHUB SECRETS:
#   EXPECTED_UPLOAD_SHA1              - Upload key SHA1 from Play Console;
#                                       checked against the keystore and
#                                       against the built AAB's signer
#
# FIRST-TIME SETUP:
#   1. Generate an upload keystore locally:
#        keytool -genkey -v -keystore upload.jks -alias upload \
#          -keyalg RSA -keysize 2048 -validity 10000
#   2. Base64-encode it and copy to ANDROID_KEYSTORE_BASE64 secret:
#        base64 -w 0 upload.jks | pbcopy        # macOS
#        base64 -w 0 upload.jks                 # Linux
#        [Convert]::ToBase64String([IO.File]::ReadAllBytes("upload.jks")) | Set-Clipboard   # Windows PowerShell
#   3. Create the app in Google Play Console (play.google.com/console):
#        - App name, default language, free/paid, declarations
#        - Content rating, target audience, data safety
#   4. Run this workflow via "Run workflow" button, download the AAB
#      artifact, and upload it to Internal testing in Play Console.
#   5. After the first upload succeeds, enroll in Play App Signing
#      (Play Console will prompt you). All future AABs are signed by
#      the upload key locally and resigned by Play with the app signing key.
#
# ================================================================

name: Android Release - Build Signed AAB

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Marketing version (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      versionCode:
        description: 'Version code: an integer above the highest Play has accepted (and above vars.ANDROID_PLAY_MAX_VERSION_CODE)'
        required: true
      buildType:
        description: 'Build type'
        required: true
        default: 'bundle'
        type: choice
        options:
          - bundle        # .aab for Play Store
          - apk           # .apk for sideloading / internal distribution

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Signed Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Self-hosted cutover (P8). An environment secret overrides the repo
    # secret of the SAME name, so this build targets the self-hosted stack only
    # once SUPABASE_URL and SUPABASE_ANON_KEY are set on the `selfhosted`
    # environment. Until then both resolve to the repo secrets (Supabase Cloud).
    # Set the plain names: `secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL`
    # prefers SUPABASE_URL, so an environment-only VITE_SUPABASE_URL would lose
    # to a repo-level SUPABASE_URL.
    environment: selfhosted

    steps:
      # ============================================================
      # 1. CHECKOUT & JDK
      # ============================================================
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # compileSdk is 37 and the runner image is not guaranteed to carry that
      # platform. AGP would auto-download it, but silently and only if the
      # licence happens to be accepted; install it explicitly so a missing
      # platform fails here with a readable message instead of mid-build.
      - name: Install Android SDK Platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0"

      # ============================================================
      # 2. VERSION NUMBERS
      # ============================================================
      # Play rejects an upload whose versionCode is not higher than the last
      # one it accepted. This step used to fall back to the workflow run
      # number, which is not tied to Play at all: it drifts (run 12 vs committed
      # versionCode 6 as of Aug 2026) and resets to 1 if this file is renamed.
      # The committed versionCode isn't a safe floor on its own either, since
      # the workflow patches it at build time and never commits the bump back,
      # so Play may already hold codes well above it. Only a human reading Play
      # Console knows the real maximum; record it in the repo variable
      # ANDROID_PLAY_MAX_VERSION_CODE after each upload.
      - name: Compute version name and code
        env:
          VERSION_NAME: ${{ github.event.inputs.versionName }}
          VERSION_CODE: ${{ github.event.inputs.versionCode }}
          FLOOR_VAR: ${{ vars.ANDROID_PLAY_MAX_VERSION_CODE }}
        run: |
          VERSION_CODE=$(echo "$VERSION_CODE" | tr -d '[:space:]')
          FLOOR_VAR=$(echo "$FLOOR_VAR" | tr -d '[:space:]')
          if [ -z "$VERSION_CODE" ]; then
            echo "::error::versionCode input is required. Pass an integer above the highest versionCode Play Console has accepted."
            exit 1
          fi
          if ! echo "$VERSION_CODE" | grep -qE '^[0-9]+$'; then
            echo "::error::versionCode '$VERSION_CODE' is not a whole number."
            exit 1
          fi
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::versionName input is required."
            exit 1
          fi

          COMMITTED=$(grep -oE 'versionCode = [0-9]+' android/app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          if [ -z "$COMMITTED" ]; then
            echo "::error::Could not read versionCode from android/app/build.gradle.kts"
            exit 1
          fi

          FLOOR=$COMMITTED
          FLOOR_SOURCE="committed versionCode in build.gradle.kts"
          if [ -n "$FLOOR_VAR" ]; then
            if ! echo "$FLOOR_VAR" | grep -qE '^[0-9]+$'; then
              echo "::error::Repo variable ANDROID_PLAY_MAX_VERSION_CODE is '$FLOOR_VAR', not a whole number."
              exit 1
            fi
            if [ "$FLOOR_VAR" -gt "$FLOOR" ]; then
              FLOOR=$FLOOR_VAR
              FLOOR_SOURCE="vars.ANDROID_PLAY_MAX_VERSION_CODE"
            fi
          else
            echo "::warning::Repo variable ANDROID_PLAY_MAX_VERSION_CODE is not set, so the floor is only the committed versionCode ($COMMITTED). Play may already have accepted higher codes; set the variable to the highest versionCode shown in Play Console."
          fi

          if [ "$VERSION_CODE" -le "$FLOOR" ]; then
            echo "::error::versionCode $VERSION_CODE is not above the floor $FLOOR ($FLOOR_SOURCE)."
            echo "::error::Play will reject this upload. Pass a versionCode greater than $FLOOR."
            exit 1
          fi

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Version: $VERSION_NAME (code $VERSION_CODE, floor $FLOOR from $FLOOR_SOURCE, committed $COMMITTED)"
          {
            echo "### Version"
            echo ""
            echo "- versionName: \`$VERSION_NAME\`"
            echo "- versionCode: \`$VERSION_CODE\` (floor $FLOOR, from $FLOOR_SOURCE)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Patch versionCode and versionName in build.gradle.kts
        working-directory: android
        run: |
          sed -i "s/versionCode = [0-9][0-9]*/versionCode = $VERSION_CODE/" app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$VERSION_NAME\"/" app/build.gradle.kts
          echo "Patched build.gradle.kts:"
          grep -E "versionCode|versionName" app/build.gradle.kts | head -5

      # ============================================================
      # 3. DECODE KEYSTORE
      # ============================================================
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set. Generate an upload keystore and add it as a base64-encoded secret."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          echo -n "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64 encoding (should be one-line base64)."
            exit 1
          fi
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "Keystore decoded ($(du -h "$KEYSTORE_PATH" | cut -f1))"

      - name: Verify keystore fingerprint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          EXPECTED_UPLOAD_SHA1: ${{ secrets.EXPECTED_UPLOAD_SHA1 }}
        run: |
          SHA1=$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" 2>/dev/null \
            | awk -F': ' '/SHA1:/ {print $2; exit}' \
            | tr -d '[:space:]')
          if [ -z "$SHA1" ]; then
            echo "::error::Could not read SHA1 from keystore — alias or password likely wrong."
            exit 1
          fi
          echo "Keystore SHA1: $SHA1"
          if [ -n "$EXPECTED_UPLOAD_SHA1" ]; then
            EXPECTED=$(echo "$EXPECTED_UPLOAD_SHA1" | tr -d '[:space:]')
            if [ "$SHA1" != "$EXPECTED" ]; then
              echo "::error::Keystore SHA1 does not match EXPECTED_UPLOAD_SHA1 secret."
              echo "::error::Play Console will reject this AAB with the 'wrong key' error."
              echo "  Expected: $EXPECTED"
              echo "  Got:      $SHA1"
              exit 1
            fi
            echo "SHA1 matches EXPECTED_UPLOAD_SHA1 — Play will accept this build."
          else
            echo "::warning::EXPECTED_UPLOAD_SHA1 secret not set — skipping fingerprint match check."
            echo "::warning::Set it to the Play Console upload key SHA1 to catch keystore drift early."
          fi

      # ============================================================
      # 4. WRITE local.properties WITH REAL SECRETS
      # ============================================================
      - name: Write local.properties
        working-directory: android
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${SUPABASE_URL:?SUPABASE_URL (or VITE_SUPABASE_URL) secret is required}"
          : "${SUPABASE_ANON_KEY:?SUPABASE_ANON_KEY (or VITE_SUPABASE_ANON_KEY) secret is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required}"

          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::GOOGLE_WEB_CLIENT_ID secret is required for release builds."
            echo "::error::Without it 'Continue with Google' does nothing visible, which Play reviews as Broken Functionality. Set the GOOGLE_WEB_CLIENT_ID repo secret to the OAuth web client ID (the one ending in .apps.googleusercontent.com)."
            exit 1
          fi
          if [ -z "$GOOGLE_MAPS_API_KEY" ]; then
            echo "::error::GOOGLE_MAPS_API_KEY secret is required for release builds."
            echo "::error::A missing/placeholder key makes the Map tab non-functional — Google Play rejects this as Broken Functionality. Set the GOOGLE_MAPS_API_KEY repo secret to a real Android-restricted key with 'Maps SDK for Android' enabled."
            exit 1
          fi

          cat > local.properties <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          RELEASE_KEYSTORE_FILE=$KEYSTORE_PATH
          RELEASE_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD
          RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS
          RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD
          EOF
          echo "local.properties written (values redacted)"

      # ============================================================
      # 5. WRITE google-services.json
      # ============================================================
      - name: Write google-services.json
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is required for release builds."
            echo "Download google-services.json from Firebase Console, then:"
            echo "  base64 -w 0 google-services.json"
            echo "and paste into the GOOGLE_SERVICES_JSON_BASE64 secret."
            exit 1
          fi
          echo -n "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          if ! jq -e .project_info.project_id google-services.json >/dev/null 2>&1; then
            echo "::error::Decoded google-services.json is invalid or missing project_info.project_id"
            exit 1
          fi
          PROJECT_ID=$(jq -r .project_info.project_id google-services.json)
          PACKAGE=$(jq -r '.client[0].client_info.android_client_info.package_name' google-services.json)
          echo "google-services.json decoded (project=$PROJECT_ID, package=$PACKAGE)"
          if [ "$PACKAGE" != "com.desmoines.aipulse" ]; then
            echo "::warning::google-services.json package_name is '$PACKAGE', expected 'com.desmoines.aipulse'"
          fi

      # ============================================================
      # 6. TEST, THEN BUILD
      # ============================================================
      # This workflow produces the artifact that goes to Play, and until now it
      # ran no automated check of any kind before building it. Tests go here
      # rather than earlier because they need the BuildConfig fields from
      # local.properties and the google-services.json written in steps 4 and 5.
      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-test-results
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

      # The release variant was never linted: CI lints debug only, and R8 /
      # release-only resources can carry errors debug doesn't. lintRelease
      # fails on any error-severity issue before the five-minute bundle build.
      - name: Lint release
        working-directory: android
        run: ./gradlew lintRelease --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-lint-report
          path: android/app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Build release ${{ github.event.inputs.buildType }}
        working-directory: android
        run: |
          if [ "${{ github.event.inputs.buildType }}" = "apk" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew bundleRelease --no-daemon
          fi

      - name: Locate output artifact
        working-directory: android
        run: |
          if [ "${{ github.event.inputs.buildType }}" = "apk" ]; then
            ARTIFACT=$(find app/build/outputs/apk/release -name "*.apk" -print -quit)
          else
            ARTIFACT=$(find app/build/outputs/bundle/release -name "*.aab" -print -quit)
          fi
          if [ -z "$ARTIFACT" ] || [ ! -f "$ARTIFACT" ]; then
            echo "::error::Release artifact not found"
            find app/build/outputs -type f | head -50
            exit 1
          fi
          echo "ARTIFACT_PATH=android/$ARTIFACT" >> $GITHUB_ENV
          echo "Artifact: $ARTIFACT ($(du -h "$ARTIFACT" | cut -f1))"

      # ============================================================
      # 7. VERIFY SIGNATURE
      # ============================================================
      # jarsigner -verify exits 0 on an unsigned AAB, and this step used to pipe
      # it into tail with no pipefail, so it could not fail. The AAB check lives
      # in scripts/android/verify-aab-signature.sh, which reads jarsigner's
      # output and matches the signer against EXPECTED_UPLOAD_SHA1 when set.
      # A missing tool fails the step; nothing here exits 0 to skip a check.
      - name: Verify signature
        shell: bash
        env:
          EXPECTED_UPLOAD_SHA1: ${{ secrets.EXPECTED_UPLOAD_SHA1 }}
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.buildType }}" = "apk" ]; then
            BUILD_TOOLS_DIR=$(ls -d "${ANDROID_HOME:-}/build-tools"/*/ 2>/dev/null | sort -V | tail -1 || true)
            if [ -z "$BUILD_TOOLS_DIR" ] || [ ! -x "${BUILD_TOOLS_DIR}apksigner" ]; then
              echo "::error::Android build-tools (apksigner) not found; cannot verify the APK signature."
              exit 1
            fi
            "${BUILD_TOOLS_DIR}apksigner" verify --print-certs "$ARTIFACT_PATH" || {
              echo "::error::APK signature verification failed"
              exit 1
            }
          else
            bash scripts/android/verify-aab-signature.sh "$ARTIFACT_PATH"
          fi
          echo "Signature verified"

      # ============================================================
      # 8. ASSERT THE BUNDLE MANIFEST
      # ============================================================
      # The May 2026 rejection was an AAB with no geo.API_KEY meta-data, and
      # nothing above reads the built artifact's manifest. This dumps it with
      # a pinned bundletool and fails unless the Maps key is real (reported
      # only as present/absent), versionCode is the one patched in step 2,
      # targetSdk is at least 36 and AD_ID / ACCESS_ADSERVICES_* are gone.
      # It also runs bundletool validate.
      - name: Assert bundle manifest
        if: github.event.inputs.buildType == 'bundle'
        shell: bash
        run: bash scripts/android/assert-aab-manifest.sh "$ARTIFACT_PATH" "$VERSION_CODE"

      # ============================================================
      # 9. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload release artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}-${{ github.event.inputs.buildType }}
          path: ${{ env.ARTIFACT_PATH }}
          retention-days: 90
          if-no-files-found: error

      - name: Upload mapping.txt (for Play Console de-obfuscation)
        if: success() && github.event.inputs.buildType == 'bundle'
        uses: actions/upload-artifact@v4
        with:
          name: android-mapping-v${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: warn

      # ============================================================
      # 10. CLEANUP
      # ============================================================
      - name: Clean up signing artifacts
        if: always()
        run: |
          rm -f "$KEYSTORE_PATH" 2>/dev/null || true
          rm -f android/local.properties 2>/dev/null || true
          rm -f android/app/google-services.json 2>/dev/null || true
          echo "Signing artifacts cleaned"

      # ============================================================
      # 11. SUMMARY
      # ============================================================
      - name: Job summary
        if: success()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Android Release Build

          | Field         | Value |
          |---------------|-------|
          | Version name  | \`${VERSION_NAME}\` |
          | Version code  | \`${VERSION_CODE}\` |
          | Build type    | \`${{ github.event.inputs.buildType }}\` |
          | Package       | \`com.desmoines.aipulse\` |
          | Artifact      | \`${ARTIFACT_PATH}\` |

          **Next steps:**
          1. Download the artifact from this run.
          2. In [Play Console](https://play.google.com/console) → your app → Testing → Internal testing → Create new release → upload the \`.aab\`.
          3. Enroll in Play App Signing if prompted.
          EOF
