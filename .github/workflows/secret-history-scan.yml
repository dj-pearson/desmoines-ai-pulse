# Secret history/tree scan (AOS-SEC-003)
# Scheduled scan of the current tree for secret-shaped strings. Reports findings
# (file + line + type ONLY — never the secret value) to the agent-secret-scan
# edge function, which opens a tier-3 incident with the rotation runbook linked.

name: Secret History Scan

on:
  schedule:
    - cron: '30 8 * * *' # daily at 08:30 UTC
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Scan tree for secret patterns (locations only)
        run: |
          node <<'EOF' > findings.json
          const { execSync } = require('child_process');
          // [type, regex]. High-entropy assignment is last (noisiest).
          const patterns = [
            ['stripe_live', '(sk|rk)_live_[0-9a-zA-Z]{20,}'],
            ['aws_access_key', 'AKIA[0-9A-Z]{16}'],
            ['google_api_key', 'AIza[0-9A-Za-z_-]{35}'],
            ['private_key', '-----BEGIN[ A-Z]*PRIVATE KEY-----'],
            ['jwt', 'eyJ[A-Za-z0-9_-]{10,}\\.eyJ[A-Za-z0-9_-]{10,}\\.[A-Za-z0-9_-]{10,}'],
            ['secret_assignment', '(api[_-]?key|secret|token|password)["\\x27]?[[:space:]]*[:=][[:space:]]*["\\x27][0-9a-zA-Z/+_-]{24,}["\\x27]'],
          ];
          const placeholder = /your[_-]|example|changeme|placeholder|xxxx|<[a-z_]+>|process\.env|import\.meta\.env|Deno\.env|VITE_|dummy|sample/i;
          const skipFile = /(^|\/)\.env\.example$|\.md$|(^|\/)dist\//i;
          const seen = new Set();
          const findings = [];
          for (const [type, pat] of patterns) {
            let out = '';
            try { out = execSync(`git grep -nIE ${JSON.stringify(pat)} -- .`, { encoding: 'utf8', maxBuffer: 20 * 1024 * 1024 }); }
            catch (e) { out = (e.stdout || '').toString(); }
            for (const raw of out.split('\n')) {
              if (!raw) continue;
              const m = raw.match(/^([^:]+):(\d+):(.*)$/);
              if (!m) continue;
              const [, file, line, content] = m;
              if (skipFile.test(file)) continue;
              if (placeholder.test(content)) continue; // allowlist placeholders
              const key = `${type}:${file}:${line}`;
              if (seen.has(key)) continue;
              seen.add(key);
              findings.push({ file, line: Number(line), type }); // NO value stored
            }
          }
          process.stdout.write(JSON.stringify({ findings }));
          EOF
          echo "findings: $(node -e "console.log(require('./findings.json').findings.length)")"

      - name: Report findings to agent-secret-scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EDGE_FUNCTION_API_KEY: ${{ secrets.EDGE_FUNCTION_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$EDGE_FUNCTION_API_KEY" ]; then
            echo "SUPABASE_URL / EDGE_FUNCTION_API_KEY not set — skipping report."
            exit 0
          fi
          curl -sS -X POST \
            "${SUPABASE_URL}/functions/v1/agent-secret-scan" \
            -H "x-api-key: ${EDGE_FUNCTION_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @findings.json \
            && echo "reported findings"
