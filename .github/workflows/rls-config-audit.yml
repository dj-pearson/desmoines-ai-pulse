# RLS / config drift audit (AOS-SEC-006)
# Regenerates the RLS audit + security config snapshot, diffs them against the
# committed baselines, and reports drift to agent-config-audit (which opens a
# tier-2 security task on new findings). Keeps WEB-SEC-005 from going stale.

name: RLS Config Drift Audit

on:
  schedule:
    - cron: '15 7 * * *' # daily at 07:15 UTC
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Regenerate audit + config snapshot
        run: |
          npx tsx scripts/audit-rls.ts --json
          npx tsx scripts/security-config-snapshot.ts

      - name: Diff against committed baselines and report drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EDGE_FUNCTION_API_KEY: ${{ secrets.EDGE_FUNCTION_API_KEY }}
        run: |
          node <<'EOF' > drift.json
          const { execSync } = require('child_process');
          const fs = require('fs');
          const readCommitted = (p) => { try { return JSON.parse(execSync(`git show HEAD:${p}`, {encoding:'utf8'})); } catch { return null; } };
          const cur = JSON.parse(fs.readFileSync('docs/rls-audit-findings.json','utf8'));
          const baseFindings = readCommitted('docs/rls-audit-findings.json') || { findingKeys: [] };
          const baseSet = new Set(baseFindings.findingKeys || []);
          const newFindings = (cur.findingKeys || []).filter((k) => !baseSet.has(k));

          const curCfg = JSON.parse(fs.readFileSync('docs/security-config-baseline.json','utf8'));
          const baseCfg = readCommitted('docs/security-config-baseline.json') || {};
          const configDrift = [];
          const curJwt = new Set(curCfg.verifyJwtFalse || []);
          const baseJwt = new Set(baseCfg.verifyJwtFalse || []);
          for (const f of curJwt) if (!baseJwt.has(f)) configDrift.push(`verify_jwt_added:${f}`);
          for (const f of baseJwt) if (!curJwt.has(f)) configDrift.push(`verify_jwt_removed:${f}`);
          if (baseCfg.cspPresent && !curCfg.cspPresent) configDrift.push('csp_removed');
          if (baseCfg.cspHash && curCfg.cspHash !== baseCfg.cspHash) configDrift.push('csp_changed');
          if (baseCfg.corsHash && curCfg.corsHash !== baseCfg.corsHash) configDrift.push('cors_changed');

          process.stdout.write(JSON.stringify({ newFindings, configDrift }));
          EOF
          echo "drift: $(cat drift.json)"
          if [ -z "$SUPABASE_URL" ] || [ -z "$EDGE_FUNCTION_API_KEY" ]; then
            echo "SUPABASE_URL / EDGE_FUNCTION_API_KEY not set — skipping report."
            exit 0
          fi
          curl -sS -X POST \
            "${SUPABASE_URL}/functions/v1/agent-config-audit" \
            -H "x-api-key: ${EDGE_FUNCTION_API_KEY}" \
            -H "Content-Type: application/json" \
            --data-binary @drift.json \
            && echo "reported drift"
