# ================================================================
# iOS CI: Auto Version Bump & Build Validation
# ================================================================
#
# Triggers automatically when iOS app files are updated on main.
# Reads the current version from ios/project.yml, auto-increments
# the patch version and build number, commits the bump, then runs
# a Simulator build + unit tests to validate compilation.
#
# Version history is tracked in ios/project.yml:
#   MARKETING_VERSION  - Semantic version shown to users (e.g. 1.1.8)
#   CURRENT_PROJECT_VERSION - Incrementing build number (e.g. 35)
#
# The auto-increment bumps PATCH (1.1.8 → 1.1.9) and build number
# (+1) on every push to ios/ on the main branch. For MINOR or MAJOR
# bumps, update ios/project.yml manually before merging.
#
# On pull requests, this workflow validates the build WITHOUT bumping
# the version (read-only).
#
# ================================================================

name: iOS CI

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/README.md'
      - '!ios/fastlane/metadata/**'
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - '!ios/README.md'
      - '!ios/fastlane/metadata/**'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch on push by default)'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - none

env:
  XCODE_VERSION: '26.0'
  PROJECT_DIR: 'ios'
  SCHEME: 'DesMoinesInsider'

# GITHUB_TOKEN needs contents:write so the version-bump job can push
# the updated ios/project.yml back to main. All other jobs only read.
# NOTE: Repo admins must also enable "Allow GitHub Actions to create
# and approve pull requests / push" under Settings → Actions → General
# → Workflow permissions (or set the default to "Read and write").
permissions:
  contents: write

# Prevent duplicate runs on the same branch and cancel stale ones
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ================================================================
  # Auto-increment version on push to main
  # ================================================================
  version-bump:
    name: Auto Version Bump
    runs-on: ubuntu-latest
    # Auto version-bump DISABLED. The marketing version and build number are
    # now managed manually in ios/project.yml and via the release workflow's
    # `version` / `build_number` inputs, so the version no longer marches ahead
    # of the build under test. To re-enable automatic patch bumps on push to
    # main, restore the previous guard:
    #   github.event_name == 'push' && github.ref == 'refs/heads/main' &&
    #   !contains(github.event.head_commit.message, '[skip ci]') &&
    #   !contains(github.event.head_commit.message, '[version bump]')
    if: false
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_build: ${{ steps.bump.outputs.new_build }}
      bumped: ${{ steps.bump.outputs.bumped }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read current version and bump
        id: bump
        run: |
          PROJECT_YML="ios/project.yml"

          # Extract current MARKETING_VERSION and CURRENT_PROJECT_VERSION
          CURRENT_VERSION=$(grep 'MARKETING_VERSION:' "$PROJECT_YML" | head -1 | sed 's/.*"\(.*\)"/\1/')
          CURRENT_BUILD=$(grep 'CURRENT_PROJECT_VERSION:' "$PROJECT_YML" | head -1 | sed 's/.*"\(.*\)"/\1/')

          echo "Current version: $CURRENT_VERSION (build $CURRENT_BUILD)"

          # Determine bump type
          BUMP_TYPE="${{ github.event.inputs.bump_type || 'patch' }}"
          if [ "$BUMP_TYPE" = "none" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "new_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "new_build=$CURRENT_BUILD" >> "$GITHUB_OUTPUT"
            echo "Skipping version bump (bump_type=none)"
            exit 0
          fi

          # Parse semantic version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          MAJOR=${MAJOR:-1}
          MINOR=${MINOR:-1}
          PATCH=${PATCH:-8}

          case "$BUMP_TYPE" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          NEW_BUILD=$((CURRENT_BUILD + 1))

          echo "Bumping: $CURRENT_VERSION → $NEW_VERSION (build $CURRENT_BUILD → $NEW_BUILD)"

          # Update project.yml
          sed -i "s/MARKETING_VERSION: \"$CURRENT_VERSION\"/MARKETING_VERSION: \"$NEW_VERSION\"/" "$PROJECT_YML"
          sed -i "s/CURRENT_PROJECT_VERSION: \"$CURRENT_BUILD\"/CURRENT_PROJECT_VERSION: \"$NEW_BUILD\"/" "$PROJECT_YML"

          # Verify the update
          grep 'MARKETING_VERSION:' "$PROJECT_YML"
          grep 'CURRENT_PROJECT_VERSION:' "$PROJECT_YML"

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_build=$NEW_BUILD" >> "$GITHUB_OUTPUT"
          echo "bumped=true" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        if: steps.bump.outputs.bumped == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios/project.yml
          git commit -m "chore(ios): bump version to ${{ steps.bump.outputs.new_version }} (build ${{ steps.bump.outputs.new_build }}) [version bump]"

          # Retry up to 3 times to handle race conditions with other pushes.
          # If push is denied (permission 403), emit a clear instruction
          # and fail the job so the problem is visible.
          for attempt in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF#refs/heads/}"; then
              echo "✅ Version bump pushed: ${{ steps.bump.outputs.new_version }} (build ${{ steps.bump.outputs.new_build }})"
              exit 0
            fi
            echo "::warning::Push attempt $attempt/3 failed. Fetching and retrying..."
            git fetch origin "${GITHUB_REF#refs/heads/}"
            git rebase "origin/${GITHUB_REF#refs/heads/}" || {
              echo "::error::Rebase failed — manual intervention needed"
              exit 1
            }
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push version bump after 3 attempts."
          echo ""
          echo "============================================================"
          echo "TROUBLESHOOTING:"
          echo "  If this is a '403 Permission denied' error, enable write"
          echo "  access for GitHub Actions in this repository:"
          echo ""
          echo "  Settings → Actions → General → Workflow permissions"
          echo "  → Select 'Read and write permissions' → Save"
          echo ""
          echo "  Or for branch protection on main, allow github-actions[bot]"
          echo "  to bypass: Settings → Branches → Edit main rule →"
          echo "  'Allow specified actors to bypass required pull requests'"
          echo "============================================================"
          exit 1

  # ================================================================
  # Build & validate the Swift project
  # ================================================================
  build:
    name: Build & Test (Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    needs: [version-bump]
    # Run even if version-bump was skipped (PRs, manual dispatch)
    if: always() && !failure() && !cancelled()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Pull latest to get the version bump commit if it happened
          ref: ${{ github.ref }}

      - name: Select Xcode version
        run: |
          if [ -d "/Applications/Xcode_${XCODE_VERSION}.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          else
            echo "::warning::Xcode ${XCODE_VERSION} not found. Using default."
            ls -d /Applications/Xcode*.app 2>/dev/null || echo "No Xcode found"
          fi
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "Swift: $(swift --version | head -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate placeholder secrets for CI build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x scripts/generate-secrets.sh
          SUPABASE_URL="https://placeholder.supabase.co" \
          SUPABASE_ANON_KEY="placeholder-key-for-ci-build" \
          bash scripts/generate-secrets.sh

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodegen generate
          echo "✅ Xcode project generated"

      - name: Resolve Swift Package Manager dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          for attempt in 1 2 3; do
            echo "SPM resolve attempt $attempt/3..."
            if xcodebuild -resolvePackageDependencies \
              -project DesMoinesInsider.xcodeproj \
              -scheme "${{ env.SCHEME }}" \
              -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache"; then
              echo "✅ SPM dependencies resolved"
              exit 0
            fi
            echo "::warning::SPM resolve attempt $attempt failed"
            rm -rf "$RUNNER_TEMP/spm-cache" 2>/dev/null || true
            sleep $((attempt * 10))
          done
          echo "::error::SPM dependency resolution failed after 3 attempts"
          exit 1

      - name: Build for iOS Simulator
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project DesMoinesInsider.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | xcpretty --color || {
              echo ""
              echo "::error::Build failed! Raw compiler errors:"
              grep -E "(error:|fatal error)" "$RUNNER_TEMP/xcodebuild.log" | head -60
              exit 1
            }
          echo "✅ iOS Simulator build succeeded"

      - name: Run unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project DesMoinesInsider.xcodeproj \
            -scheme "${{ env.SCHEME }}" \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-test.log" | xcpretty --color --test || {
              echo ""
              echo "::error::Tests failed!"
              grep -E "(Test Case.*failed|error:)" "$RUNNER_TEMP/xcodebuild-test.log" | head -30
              exit 1
            }
          echo "✅ Unit tests passed"

      # IOS-AUDIT-REL-015: DesMoinesInsiderUITests existed and ran only in the
      # screenshot lane, which is manual. These are navigation tests that happen
      # to take screenshots - they tap a tab and wait for content - so they catch
      # the two failures unit tests structurally cannot: the app not launching at
      # all, and a tab or screen disappearing.
      #
      # Same job as the unit tests on purpose: the simulator is already booted
      # and the SPM cache is warm, so this costs a UI-test build rather than a
      # whole extra job.
      # Bounded so a hung UI test fails this step instead of eating the job's
      # 30 minutes and taking the already-passed unit-test result down with it.
      # A UI test that waits on an element which never appears does not fail on
      # its own - it waits until something outside kills it.
      #
      # 12 WAS TOO TIGHT AND COST A RED MAIN. Run 32651998578 on main failed with
      # "The action 'Run UI tests' has timed out after 12 minutes" - not an
      # assertion, just the cap. Measured across the four most recent successes
      # this step takes 6, 7, 8 and 9 minutes, so 12 left three minutes of
      # headroom against a simulator suite whose runtime varies with runner
      # performance and simulator boot. That is not enough margin to be a hang
      # detector; it is a coin flip.
      #
      # 20 KEEPS THE ORIGINAL INTENT AND STILL BOUNDS A HANG. The job's own
      # numbers: total 14 minutes, of which build 2 and unit tests 3, against a
      # 30-minute job cap. So 5 + 20 = 25 leaves the job timeout as a real
      # backstop, and 20 is over twice the slowest observed run.
      - name: Run UI tests
        timeout-minutes: 20
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          xcodebuild test \
            -project DesMoinesInsider.xcodeproj \
            -scheme DesMoinesInsiderUITests \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=latest" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-cache" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild-uitest.log" | xcpretty --color --test || {
              echo ""
              echo "::error::UI tests failed!"
              grep -E "(Test Case.*failed|error:)" "$RUNNER_TEMP/xcodebuild-uitest.log" | head -30
              exit 1
            }
          echo "UI tests passed"

      - name: Report version
        if: needs.version-bump.outputs.bumped == 'true'
        run: |
          echo "### iOS Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Version** | ${{ needs.version-bump.outputs.new_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ${{ needs.version-bump.outputs.new_build }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ================================================================
  # Validate project configuration (fast, runs on Linux)
  # ================================================================
  validate-config:
    name: Validate iOS Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project structure
        run: |
          echo "=== Checking required files ==="
          ERRORS=0
          for f in \
            ios/project.yml \
            ios/DesMoinesInsider/App/DesMoinesInsiderApp.swift \
            ios/DesMoinesInsider/Resources/Info.plist \
            ios/DesMoinesInsider/Configuration/Config.swift \
            ios/DesMoinesInsider/App/DesMoinesInsider.entitlements \
            ios/scripts/generate-secrets.sh \
            ios/.gitignore; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              ERRORS=$((ERRORS + 1))
            fi
          done

          echo ""
          echo "=== Version info ==="
          grep 'MARKETING_VERSION:' ios/project.yml
          grep 'CURRENT_PROJECT_VERSION:' ios/project.yml

          # IOS-AUDIT-REL-016: the iOS MARKETING_VERSION and the backend
          # LATEST_APP_VERSION.ios (consumed by the version-check flow) must stay
          # in lock-step. Fail the job if they drift so a release can't ship a
          # binary the backend doesn't recognize as current.
          MKT_VERSION=$(grep 'MARKETING_VERSION:' ios/project.yml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          BACKEND_VERSION=$(grep -A3 'const LATEST_APP_VERSION' supabase/functions/_shared/minSupportedVersions.ts | grep -m1 'ios:' | sed 's/.*"\(.*\)".*/\1/')
          echo "iOS MARKETING_VERSION: $MKT_VERSION | backend LATEST_APP_VERSION.ios: $BACKEND_VERSION"
          if [ "$MKT_VERSION" != "$BACKEND_VERSION" ]; then
            echo "::error::Version drift: project.yml MARKETING_VERSION ($MKT_VERSION) != minSupportedVersions.ts LATEST_APP_VERSION.ios ($BACKEND_VERSION)"
            ERRORS=$((ERRORS + 1))
          fi

          echo ""
          SWIFT_COUNT=$(find ios/DesMoinesInsider -name "*.swift" | wc -l | xargs)
          echo "Swift files: $SWIFT_COUNT"

          if [ $ERRORS -gt 0 ]; then
            echo "::error::$ERRORS required file(s) missing"
            exit 1
          fi
          echo "✅ Configuration validation passed"

      # IOS-AUDIT-SEC-013 AC5: certificate pins are the one thing in this app
      # that can take every installed binary offline with no server-side remedy,
      # and they drift on their own schedule - the Supabase leaf reissues about
      # every 90 days. This fails when fewer than two declared pins appear in
      # the live chain, which is the point at which one more rotation would lock
      # out every enforcing client. See docs/CERT_PIN_ROTATION.md.
      # IOS-AUDIT-REL-014: a required-reason API used but not declared is what
      # gets a submission rejected, and the reviewer is the one who finds it.
      # Offline; no credentials needed.
      # IOS-AUDIT-UX-060: Swift has no warning for an unused internal property,
      # and every one found here so far was a MISSING SURFACE rather than dead
      # code - state a screen needed that no screen read.
      - name: Unread view-model and service members
        run: node scripts/check-unused-members.mjs

      - name: Privacy manifest reconciliation
        run: node scripts/check-privacy-manifest.mjs

      # IOS-AUDIT-REL-008: the Snapfile already SAID the three device lists must
      # match and nothing enforced it. The screenshot lane is workflow_dispatch-
      # only, so a drift produces no failure at all - the first symptom is a
      # submission missing a required size. Offline; reads three files.
      - name: Screenshot device lists agree
        run: node scripts/check-screenshot-devices.mjs

      - name: Verify certificate pins against the live host
        run: bash scripts/verify-cert-pins.sh
