name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Create local.properties with placeholder credentials
        working-directory: android
        run: |
          cat > local.properties << 'EOF'
          SUPABASE_URL=https://placeholder.supabase.co
          SUPABASE_ANON_KEY=placeholder-anon-key
          GOOGLE_WEB_CLIENT_ID=placeholder-client-id
          GOOGLE_MAPS_API_KEY=placeholder-maps-key
          EOF

      - name: Create placeholder google-services.json
        working-directory: android/app
        run: |
          cat > google-services.json << 'EOFGS'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.desmoines.aipulse"
                  }
                },
                "api_key": [
                  {
                    "current_key": "placeholder-api-key"
                  }
                ],
                "services": {}
              }
            ],
            "configuration_version": "1"
          }
          EOFGS

      - name: Run Lint
        working-directory: android
        run: ./gradlew lint

      - name: Run Unit Tests
        working-directory: android
        run: ./gradlew test

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: android/app/build/reports/lint-results-*.html

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
