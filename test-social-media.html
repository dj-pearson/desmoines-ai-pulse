<!DOCTYPE html>
<html>
<head>
    <title>Test Social Media Manager</title>
</head>
<body>
    <h1>Test Social Media Manager</h1>
    <button id="testGenerate">Test Generate Event Post</button>
    <div id="result"></div>

    <script>
        document.getElementById('testGenerate').onclick = async () => {
            try {
                const response = await fetch('https://wtkhfqpmcegzcbngroui.supabase.co/functions/v1/social-media-manager', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + (window.SUPABASE_ANON_KEY || prompt('Supabase anon key'))
                    },
                    body: JSON.stringify({
                        action: 'generate',
                        contentType: 'event',
                        subjectType: 'event_of_the_day'
                    })
                });
                
                const result = await response.json();
                document.getElementById('result').innerHTML = `
                    <h3>Response (${response.status}):</h3>
                    <pre>${JSON.stringify(result, null, 2)}</pre>
                `;
            } catch (error) {
                document.getElementById('result').innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
            }
        };
    </script>
</body>
</html>
