name: DesMoinesInsider
options:
  bundleIdPrefix: com.desmoines
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.3"
    CURRENT_PROJECT_VERSION: "30"

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift
    from: "2.0.0"

targets:
  DesMoinesInsider:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DesMoinesInsider
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DesMoinesInsider/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.desmoines.aipulse
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    preBuildScripts:
      - name: Generate Supabase Secrets
        script: |
          # Generate Secrets.generated.swift from environment variables.
          # In CI, SUPABASE_URL and SUPABASE_ANON_KEY are set by the workflow.
          # For local development, create ios/Secrets.xcconfig or set env vars.
          if [ -f "$PROJECT_DIR/scripts/generate-secrets.sh" ]; then
            bash "$PROJECT_DIR/scripts/generate-secrets.sh"
          else
            echo "warning: generate-secrets.sh not found — using placeholder secrets"
          fi
        basedOnDependencyAnalysis: false
    dependencies:
      - package: Supabase
      - target: DesMoinesInsiderClip
        embed: true
    entitlements:
      path: DesMoinesInsider/App/DesMoinesInsider.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:desmoinesinsider.com
          - webcredentials:desmoinesinsider.com

  # ──────────────────────────────────────────────────
  # App Clip Target
  # ──────────────────────────────────────────────────
  DesMoinesInsiderClip:
    type: application.on-demand-install-capable
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DesMoinesInsiderClip
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DesMoinesInsiderClip/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.desmoines.aipulse.Clip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: -Onone
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: Supabase
    entitlements:
      path: DesMoinesInsiderClip/DesMoinesInsiderClip.entitlements
      properties:
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.associated-domains:
          - appclip:desmoinesinsider.com

  # ──────────────────────────────────────────────────
  # Unit Test Target — Core service and utility tests
  # ──────────────────────────────────────────────────
  DesMoinesInsiderTests:
    type: bundle.unit-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DesMoinesInsiderTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DesMoinesInsiderTests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.desmoines.aipulse.tests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
    dependencies:
      - target: DesMoinesInsider

  # ──────────────────────────────────────────────────
  # UI Test Target — Used by Fastlane Snapshot for
  # automated App Store screenshot generation.
  # ──────────────────────────────────────────────────
  DesMoinesInsiderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DesMoinesInsiderUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DesMoinesInsiderUITests/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.desmoines.aipulse.uitests
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        TEST_HOST: ""
        TEST_TARGET_NAME: DesMoinesInsider
    dependencies:
      - target: DesMoinesInsider

schemes:
  DesMoinesInsider:
    build:
      targets:
        DesMoinesInsider: all
        DesMoinesInsiderClip: all
        DesMoinesInsiderTests: [test]
    run:
      config: Debug
      storeKitConfiguration: DesMoinesInsider/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - DesMoinesInsiderTests
    profile:
      config: Release
    archive:
      config: Release

  # Scheme for running UI tests / Fastlane Snapshot
  DesMoinesInsiderUITests:
    build:
      targets:
        DesMoinesInsider: all
        DesMoinesInsiderUITests: [test]
    test:
      config: Debug
      targets:
        - DesMoinesInsiderUITests
